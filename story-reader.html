<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Crew Story · 閱讀</title><link rel="stylesheet" href="crew.css?v={{ site.github.build_revision }}"><link rel="stylesheet" href="features/story/styles.css?v={{ site.github.build_revision }}"></head><body>
<header class="topbar"><div class="shell inner"><a class="brand" href="story-shelf.html"><span class="brandmark">‹</span><span>Story 書架</span></a><a class="status" data-gemini-status href="settings.html"><i class="status-dot"></i><span data-gemini-status-text>設定 Gemini</span></a></div></header>

<div class="toast" id="toast"></div><script src="crew.js?v={{ site.github.build_revision }}"></script><script src="features/shared/db.js?v={{ site.github.build_revision }}"></script><script src="features/story/shelf/store.js?v={{ site.github.build_revision }}"></script><script src="features/story/reader/page.js?v={{ site.github.build_revision }}"></script></body></html>
