<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Crew Fortune</title><link rel="stylesheet" href="crew.css"></head><body><header class="topbar"><div class="shell inner"><a class="brand" href="index.html"><span class="brandmark">C</span><span>Crew</span></a><a class="status" data-gemini-status href="settings.html"><i class="status-dot"></i><span data-gemini-status-text>設定 Gemini</span></a></div></header>
<main class="shell page"><section class="hero"><span class="eyebrow"><i></i> Crew Fortune</span><h1>今日探索</h1><p class="lead">把它當成反思工具：看今天、問一件事，或整理近期方向。</p></section>
<div class="panel"><label class="label">出生日期</label><input class="field" id="birth" type="date"><p class="meta">只存在這台裝置。娛樂與自我反思用途，不替代重大決策。</p></div>
<div class="tabs section"><button class="tab active" data-tab="today">今天</button><button class="tab" data-tab="ask">問一件事</button><button class="tab" data-tab="direction">近期方向</button><button class="tab" data-tab="history">歷史</button></div>
<section class="view active section" id="today"><div class="panel"><div class="two"><div><label class="label">主題</label><select class="field" id="focus"><option>工作</option><option>財運</option><option>關係</option><option>整體</option></select></div><div><label class="label">今天想要</label><select class="field" id="tone"><option>簡短直接</option><option>溫和提醒</option><option>具體行動</option></select></div></div><div class="actions"><button class="btn" id="todayGo">看今天</button></div><div class="result empty" id="todayResult">結果會出現在這裡。</div></div></section>
<section class="view section" id="ask"><div class="panel"><label class="label">你最近卡在哪一件事？</label><textarea class="field" id="askInput" placeholder="例如：最近有個工作機會，我不知道該不該接"></textarea><div class="actions"><button class="btn" id="askGo">幫我整理</button></div><div class="result empty" id="askResult">會用反思型方式回答，不會把結果說成命定事實。</div></div></section>
<section class="view section" id="direction"><div class="panel"><div class="two"><div><label class="label">時間範圍</label><select class="field" id="range"><option>接下來 7 天</option><option selected>接下來 30 天</option><option>接下來 3 個月</option></select></div><div><label class="label">想看</label><select class="field" id="directionFocus"><option>工作</option><option>財務節奏</option><option>家庭</option><option>整體</option></select></div></div><div class="actions"><button class="btn" id="directionGo">看方向</button></div><div class="result empty" id="directionResult">會整理成「可以推進 / 先觀察 / 一個行動」。</div></div></section>
<section class="view section" id="history"><div class="list" id="fortuneHistory"></div></section>
</main><nav class="bottom-nav"><div class="inner">
<a class="navitem " data-nav="home" href="index.html"><b>⌂</b><span>首頁</span></a>
<a class="navitem " data-nav="teacher" href="teacher.html"><b>A</b><span>語言</span></a>
<a class="navitem " data-nav="story" href="story.html"><b>S</b><span>故事</span></a>
<a class="navitem active" data-nav="fortune" href="fortune.html"><b>F</b><span>探索</span></a>
<a class="navitem " data-nav="settings" href="settings.html"><b>⚙</b><span>設定</span></a>
</div></nav><div class="toast" id="toast"></div><script src="crew.js"></script><script>
CrewAI.nav("fortune");var birth=document.getElementById("birth");birth.value=localStorage.getItem("crew_birth_date")||"";birth.onchange=function(){localStorage.setItem("crew_birth_date",birth.value)};
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active")});document.querySelectorAll(".view").forEach(function(x){x.classList.remove("active")});b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active");if(b.dataset.tab==="history")renderHistory()}});
function needBirth(){if(!birth.value){CrewAI.toast("先輸入出生日期");return false}if(!CrewAI.requireKey())return false;return true}
async function run(btn,res,prompt,title){if(!needBirth())return;CrewAI.busy(btn,true,"分析中…");res.classList.remove("empty");res.textContent="Gemini 正在整理…";try{var out=await CrewAI.call(prompt,{system:"你是 Crew Fortune 的反思型分析助手。不要宣稱預測事實，不做醫療、投資或重大決策建議。語氣成熟、具體、不神神叨叨。",temperature:.8,maxOutputTokens:800});res.textContent=out;CrewAI.historyAdd("fortune",{title:title,preview:out.slice(0,120)})}catch(e){res.textContent="失敗：\n"+e.message}finally{CrewAI.busy(btn,false)}}
document.getElementById("todayGo").onclick=function(){run(this,document.getElementById("todayResult"),"今天日期："+new Date().toISOString().slice(0,10)+"\n出生日期："+birth.value+"\n主題："+document.getElementById("focus").value+"\n語氣："+document.getElementById("tone").value+"\n請用繁中給今日反思。格式：今日主軸 / 適合做 / 先別急 / 一個小行動。","今日 · "+document.getElementById("focus").value)};
document.getElementById("askGo").onclick=function(){var q=document.getElementById("askInput").value.trim();if(!q){CrewAI.toast("先寫下問題");return}run(this,document.getElementById("askResult"),"出生日期："+birth.value+"\n問題："+q+"\n不要替使用者做決定。請從盲點、優先順序、可以驗證的小步驟三個角度整理。","問一件事 · "+q.slice(0,24))};
document.getElementById("directionGo").onclick=function(){run(this,document.getElementById("directionResult"),"出生日期："+birth.value+"\n範圍："+document.getElementById("range").value+"\n主題："+document.getElementById("directionFocus").value+"\n請做娛樂與反思型的近期方向整理。格式：可以推進 / 先觀察 / 可能的摩擦 / 一個行動。","近期方向 · "+document.getElementById("directionFocus").value)};
var q=new URLSearchParams(location.search).get("q");if(q){document.querySelector('[data-tab="ask"]').click();document.getElementById("askInput").value=q}
function renderHistory(){var a=CrewAI.historyGet("fortune"),el=document.getElementById("fortuneHistory");el.innerHTML=a.length?a.map(function(x){return '<div class="list-item"><div><strong>'+CrewAI.esc(x.title)+'</strong><small>'+CrewAI.esc(x.preview)+'</small></div></div>'}).join(""):'<div class="notice"><div><b>還沒有紀錄</b><p>分析後會保存在這台裝置。</p></div></div>'}
</script></body></html>
