<h1>小模型，能不能像 Kokoro 一樣好聽？</h1><p>英文、中文、韓文分開比較。相同文字逐一生成，首次按下才下載模型；不呼叫 Koolo 的付費語音服務、不使用系統語音替代。標示為模型權重估計，不含執行環境與字典。</p>
<section><label for="language">測試語言</label><select id="language"><option value="en">英文</option><option value="zh">中文</option><option value="ko">韓文</option></select><label for="text">測試文字</label><textarea id="text" maxlength="400" lang="en">It depends on the situation.</textarea>
<div class="presets"><button data-text="Comfortable.">單字</button><button data-text="It depends on the situation.">片語</button><button data-text="Nice to meet you, Zoe.">起音測試</button><button data-text="I thought it would be difficult, but after a little practice, I realized it was much easier than I expected.">長句</button><button data-text="Seventeen, seventy, three, thirty, thirteen, and thirty-three.">數字</button></div>
<label for="voice">音色</label><select id="voice"><option value="af_heart">美式女聲（Kokoro / Paradee 同音色）</option><option value="am_puck">美式男聲</option><option value="bf_isabella">英式女聲</option><option value="bm_fable">英式男聲</option></select><label for="speed">速度（Phonon 固定原速）</label><select id="speed"><option value="1">正常</option><option value=".85">慢速</option></select><p id="global" role="status" aria-live="polite">選擇一個模型開始試聽。</p></section>
<div class="grid" id="models"></div>
<p data-lang="zh" hidden>其他台灣華語候選：<a href="https://huggingface.co/spaces/Luigi/PrimeTTS-vs-Inflect-Nano-v1" target="_blank" rel="noopener">PrimeTTS 官方試聽（外部服務，非本機）</a>。Piper、sanoTTS 尚待核對訓練資料授權，僅供評估。</p><p data-lang="ko" hidden>其他韓文候選：<a href="https://huggingface.co/akamotaco/ppaso-tts-v1" target="_blank" rel="noopener">Ppaso-TTS 官方樣音</a>。Kitten 使用完整 eSpeak WASM 韓文音素（首次額外下載約 18 MB 共用發音字典），尚需聽感驗證。</p>
