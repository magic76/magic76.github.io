<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 64" role="img" aria-label="Koolo">
  <style>
    .letter { animation: koolo-hop 1.5s ease-in-out infinite; }
    .two { animation-delay: .09s; }
    .three { animation-delay: .18s; }
    .four { animation-delay: .27s; }
    .five { animation-delay: .36s; }
    .dot { animation-delay: .45s; }
    .ink { fill: #153A35; }
    .stroke { stroke: #153A35; }
    .accent { stroke: #55B68D; }
    @keyframes koolo-hop {
      0%, 38%, 100% { transform: translateY(0); }
      18% { transform: translateY(-8px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .letter { animation: none; }
    }
  </style>
  <g transform="translate(0 10)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g class="letter stroke"><path d="M15 10V36M15 25 31 11M16 25 32 37" stroke-width="9.2"/></g>
      <g class="letter two"><circle cx="53" cy="24" r="10.2" class="stroke" stroke-width="8.8"/><circle cx="55" cy="22.7" r="2.2" class="ink"/></g>
      <g class="letter three"><circle cx="79" cy="24" r="10.2" class="stroke" stroke-width="8.8"/><circle cx="81" cy="22.7" r="2.2" class="ink"/></g>
      <g class="letter four stroke"><path d="M105 10V37" stroke-width="9.4"/></g>
      <g class="letter five stroke"><circle cx="130" cy="24" r="10.3" stroke-width="8.8"/></g>
      <path d="M55 44Q66 47 77 44M57 7l-2-3M66 6V3.5m9 3.5 2-3" class="accent" stroke-width="3.2"/>
    </g>
    <circle cx="152" cy="33" r="3.4" fill="#FF9678" class="letter dot"/>
  </g>
</svg>
