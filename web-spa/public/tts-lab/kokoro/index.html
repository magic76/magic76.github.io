<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#101713">
<title>Koolo TTS Lab · Kokoro 本機語音</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color-scheme:dark;background:#0c110e;color:#f4f7f5}
*{box-sizing:border-box}body{margin:0;min-width:280px;background:radial-gradient(circle at top,#20352a 0,#0c110e 48%);min-height:100vh}
main{max-width:680px;margin:auto;padding:24px 16px 56px}.nav{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:28px}
a{color:#9ce7bb}.logo{text-decoration:none;color:#eef8f1;font-weight:800}.pill{border:1px solid #42604f;border-radius:999px;padding:6px 10px;font-size:12px;color:#bfe0cc}
h1{font-size:clamp(30px,8vw,44px);letter-spacing:-.04em;line-height:1.1;margin:0 0 12px}.intro{color:#b3c6bc;line-height:1.7;margin:0 0 22px}
.card{background:rgba(22,32,27,.94);border:1px solid #31473a;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 16px 40px rgba(0,0,0,.18)}
label{display:block;font-size:13px;color:#b8c9bf;margin-bottom:7px}input,select{width:100%;border:1px solid #425b4c;background:#101713;color:#fff;border-radius:12px;padding:13px 14px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button{border:0;border-radius:13px;padding:13px 14px;font-size:15px;font-weight:750;cursor:pointer;background:#edf5f0;color:#102017}
button.primary{background:#67e49e;color:#092013}button:disabled{opacity:.45;cursor:not-allowed}
.presets{display:flex;gap:8px;overflow:auto;padding:10px 0 2px}.presets button{white-space:nowrap;background:#26372e;color:#d9e8df;padding:9px 11px}
.status{margin-top:12px;border-radius:12px;background:#101713;padding:12px;color:#c7d6ce;min-height:48px;line-height:1.45;overflow-wrap:anywhere}
.meter{height:8px;background:#26372e;border-radius:99px;overflow:hidden;margin-top:8px}.meter span{display:block;height:100%;width:0;background:#67e49e;transition:width .15s ease}
.note{font-size:12px;color:#99aaa1;line-height:1.6}.badge{display:inline-flex;border:1px solid #3d5648;border-radius:999px;padding:6px 9px;font-size:12px;color:#c7d6ce}
audio{width:100%;margin-top:12px}audio[hidden]{display:none}
@media(max-width:520px){.grid,.actions{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>
<body>
<main>
<nav class="nav"><a class="logo" href="/tts-lab/">← TTS Lab</a><span class="pill">LOCAL AI</span></nav>
<h1>Kokoro 本機語音</h1>
<p class="intro">不呼叫 Koolo 的 TTS Worker，直接在瀏覽器下載 Kokoro 模型，用 WebGPU 或 WASM 本機生成。選擇語言和音色，直接比較單字與短句。按播放才下載模型。</p>

<section class="card">
<label for="lang">測試語言</label><select id="lang" style="margin-bottom:14px"><option value="en-US">美式英文</option><option value="en-GB">英式英文</option><option value="zh">中文 · 國語</option><option value="ja">日本語 · 日文</option><option value="es">Español · 西班牙文</option><option value="fr">Français · 法文</option><option value="hi">हिन्दी · 印地文</option><option value="it">Italiano · 義大利文</option><option value="pt-BR">Português · 巴西葡萄牙文</option></select><label for="text">測試文字</label>
<input id="text" maxlength="120" value="comfortable" autocomplete="off" spellcheck="false">
<div class="presets" id="presets" aria-label="測試字詞"></div>
</section>

<section class="card">
<div class="grid">
<div><label for="voice">Kokoro voice</label><select id="voice"></select></div>
<div><label for="speed">速度</label><select id="speed">
<option value="1">正常 1.0×</option>
<option value="0.85">慢速 0.85×</option>
</select></div>
</div>
<div style="margin-top:14px"><label for="mode">運算模式 / 模型大小</label><select id="mode"></select><p id="mode-note" class="note"></p></div>
<div class="actions">
<button id="system" type="button">🔊 系統 TTS</button>
<button id="kokoro" class="primary" type="button">✨ Kokoro</button>
</div>
<audio id="player" controls preload="none" hidden></audio>
</section>

<section class="card">
<span id="runtime" class="badge">偵測執行環境…</span>
<div id="status" class="status" role="status" aria-live="polite">Kokoro 尚未載入。第一次按 Kokoro 才下載模型。</div>
<div class="meter" aria-hidden="true"><span id="progress"></span></div>
<p class="note" id="model-note"></p><p class="note">原模型有八種語言（英美分列九項），沒有韓文。中文為 v1.1 國語，不保證台灣腔；本頁僅供實驗。</p><p class="note">來源：<a href="https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md">音色與授權（含日文、法文 CC BY）</a> · <a href="https://github.com/uzen-zone/kokoro-js">中文移植</a> · <a href="https://github.com/nerosui/kokoro-js-jp/blob/main/THIRD_PARTY_NOTICES.md">日文移植及授權</a> · <a href="https://github.com/hexgrad/misaki">Misaki 音素</a> · <a href="https://github.com/cB-Sigma/uccharan">uccharan 發音處理</a></p>
</section>
</main>

<script type="module">

const KOKORO_URL="https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/dist/kokoro.web.js";
const MODEL_ID="onnx-community/Kokoro-82M-v1.0-ONNX";
const ZH_URL="https://cdn.jsdelivr.net/npm/@uzen/kokoro-js@1.2.4/dist/kokoro.web.js";
const ZH_MODEL="onnx-community/Kokoro-82M-v1.1-zh-ONNX";
const JA_URL="https://cdn.jsdelivr.net/npm/kokoro-js-jp@0.2.0/dist/kokoro-jp.web.js";
const G2P_BASE="https://cdn.jsdelivr.net/npm/uccharan@1.0.0/";
const G2P_URL=G2P_BASE+"index.js";
const ZH_VOICES=["zf_001","zf_002","zf_003","zf_004","zf_005","zf_006","zf_007","zf_008","zf_017","zf_018","zf_019","zf_021","zf_022","zf_023","zf_024","zf_026","zf_027","zf_028","zf_032","zf_036","zf_038","zf_039","zf_040","zf_042","zf_043","zf_044","zf_046","zf_047","zf_048","zf_049","zf_051","zf_059","zf_060","zf_067","zf_070","zf_071","zf_072","zf_073","zf_074","zf_075","zf_076","zf_077","zf_078","zf_079","zf_083","zf_084","zf_085","zf_086","zf_087","zf_088","zf_090","zf_092","zf_093","zf_094","zf_099","zm_009","zm_010","zm_011","zm_012","zm_013","zm_014","zm_015","zm_016","zm_020","zm_025","zm_029","zm_030","zm_031","zm_033","zm_034","zm_035","zm_037","zm_041","zm_045","zm_050","zm_052","zm_053","zm_054","zm_055","zm_056","zm_057","zm_058","zm_061","zm_062","zm_063","zm_064","zm_065","zm_066","zm_068","zm_069","zm_080","zm_081","zm_082","zm_089","zm_091","zm_095","zm_096","zm_097","zm_098","zm_100"];
const LANGUAGES={
 "en-US":{route:"base",locale:"en-US",sample:["comfortable","entrepreneur","thought","world","schedule","I really like this movie."],voices:["af_heart","af_bella","af_alloy","af_aoede","af_jessica","af_kore","af_nicole","af_nova","af_river","af_sarah","af_sky","am_michael","am_adam","am_echo","am_eric","am_fenrir","am_liam","am_onyx","am_puck","am_santa"]},
 "en-GB":{route:"base",locale:"en-GB",sample:["comfortable","schedule","water","thought","world","I really like this film."],voices:["bf_emma","bf_alice","bf_isabella","bf_lily","bm_george","bm_daniel","bm_fable","bm_lewis"]},
 zh:{route:"zh",locale:"zh-TW",sample:["舒服","你好","銀行","旅行","今天天氣很好。","你想和我一起練習中文嗎？"],voices:ZH_VOICES},
 ja:{route:"ja",locale:"ja-JP",sample:["ありがとう","こんにちは","心地よい","旅行","今日はいい天気ですね。","一緒に日本語を練習しませんか？"],voices:["jf_alpha","jf_gongitsune","jf_nezumi","jf_tebukuro","jm_kumo"]},
 es:{route:"base",locale:"es-ES",g2p:"es",sample:["cómodo","gracias","mañana","viaje","¡Buenos días!","¿Quieres practicar español conmigo?"],voices:["ef_dora","em_alex","em_santa"]},
 fr:{route:"base",locale:"fr-FR",g2p:"fr",sample:["bonjour","merci","confortable","voyage","Il fait beau aujourd'hui.","Tu veux pratiquer le français avec moi ?"],voices:["ff_siwis"]},
 hi:{route:"base",locale:"hi-IN",g2p:"hi",sample:["नमस्ते","धन्यवाद","आरामदायक","यात्रा","आज मौसम अच्छा है।","क्या आप मेरे साथ हिंदी का अभ्यास करना चाहेंगे?"],voices:["hf_alpha","hf_beta","hm_omega","hm_psi"]},
 it:{route:"base",locale:"it-IT",g2p:"it",sample:["ciao","grazie","comodo","viaggio","Oggi è una bella giornata.","Vuoi praticare l'italiano con me?"],voices:["if_sara","im_nicola"]},
 "pt-BR":{route:"base",locale:"pt-BR",g2p:"pt-br",sample:["olá","obrigado","confortável","viagem","Hoje está um dia lindo.","Quer praticar português comigo?"],voices:["pf_dora","pm_alex","pm_santa"]}
};
const $=s=>document.querySelector(s);
const lang=$("#lang"),text=$("#text"),voice=$("#voice"),speed=$("#speed"),system=$("#system"),kokoro=$("#kokoro"),player=$("#player"),status=$("#status"),runtime=$("#runtime"),progress=$("#progress"),mode=$("#mode");
let active=null,objectUrl="",busy=false,previousLang=lang.value,g2pPromise=null;
const drafts=new Map(),selectedVoices=new Map();
const hasWebGpu=typeof navigator!=="undefined"&&"gpu" in navigator;
// Sizes from the upstream ONNX file listings, decimal MB, not total transfer.
const MODEL_SIZES={base:{fp32:326,fp16:163,q8:92.4,q4:305,q4f16:155},zh:{fp32:339,fp16:164,q8:127,q4:341,q4f16:166}};
const MODES=[
 {id:"auto",label:"自動（原本預設）"},
 {id:"wasm-q8",device:"wasm",dtype:"q8",label:"WASM Q8"},
 {id:"wasm-fp32",device:"wasm",dtype:"fp32",label:"WASM FP32"},
 {id:"wasm-q4",device:"wasm",dtype:"q4",label:"WASM Q4"},
 {id:"webgpu-fp32",device:"webgpu",dtype:"fp32",label:"WebGPU FP32"},
 {id:"webgpu-fp16",device:"webgpu",dtype:"fp16",label:"WebGPU FP16"},
 {id:"webgpu-q4f16",device:"webgpu",dtype:"q4f16",label:"WebGPU Q4F16"}
];
let gpuPromise=null, gpuInfo=null;
function probeGpu(){
 if(!gpuPromise)gpuPromise=(async()=>{
  try{const adapter=hasWebGpu?await navigator.gpu.requestAdapter():null;
   return {available:!!adapter,f16:!!adapter?.features?.has("shader-f16")};
  }catch{return {available:false,f16:false};}
 })().then(info=>{gpuInfo=info;return info;});
 return gpuPromise;
}
function resolveMode(route,id,gpu){
 const chosen=MODES.find(m=>m.id===id);
 if(!chosen)throw Error("未知運算模式");
 if(id==="auto")return {device:gpu.available?"webgpu":"wasm",dtype:gpu.available||route==="zh"?"fp32":"q8"};
 if(chosen.device==="webgpu"&&!gpu.available)throw Error("此裝置沒有可用 WebGPU adapter，請選 WASM");
 if(chosen.device==="webgpu"&&(chosen.dtype==="fp16"||chosen.dtype==="q4f16")&&!gpu.f16)throw Error("此 GPU 不支援 shader-f16，請選 FP32 或 WASM");
 return {device:chosen.device,dtype:chosen.dtype};
}
function modelSize(route,dtype){return MODEL_SIZES[route==="zh"?"zh":"base"][dtype];}
function sessionKey(route,config){return route+":"+config.device+":"+config.dtype;}
function modeLabel(config){return (config.device==="webgpu"?"WebGPU":"WASM")+" "+config.dtype.toUpperCase();}
function renderModeOptions(){
 const route=LANGUAGES[lang.value].route,previous=mode.value||"auto";
 mode.replaceChildren(...MODES.map(m=>{
  const o=document.createElement("option");o.value=m.id;
  const cfg=m.id==="auto"?resolveMode(route,m.id,gpuInfo||{available:hasWebGpu}):m;
  o.textContent=m.label+" · "+modelSize(route,cfg.dtype)+" MB"+(route==="zh"&&(cfg.dtype==="q8"||cfg.dtype==="q4")?"（音質實驗）":"");
  o.disabled=!!gpuInfo&&m.device==="webgpu"&&(!gpuInfo.available||((m.dtype==="fp16"||m.dtype==="q4f16")&&!gpuInfo.f16));
  return o;
 }));
 mode.value=previous;
 if(mode.options[mode.selectedIndex]?.disabled)mode.value="auto";
 renderModeStatus();
}
function renderModeStatus(){
 const route=LANGUAGES[lang.value].route,gpu=gpuInfo||{available:hasWebGpu,f16:true};
 let cfg;
 try{cfg=resolveMode(route,mode.value||"auto",gpu);}
 catch(e){runtime.textContent="模式不可用";$("#mode-note").textContent=e.message;progress.style.width="0";return;}
 const key=sessionKey(route,cfg);
 runtime.textContent=modeLabel(cfg)+(active?.key===key?" · 已就緒":gpuInfo?" · 待載入":" · 偵測中");
 progress.style.width=active?.key===key?"100%":"0";
 $("#mode-note").textContent="權重約 "+modelSize(route,cfg.dtype)+" MB；不含音色、發音詞典與執行環境。"+(route==="zh"&&(cfg.dtype==="q8"||cfg.dtype==="q4")?" 中文作者不推薦此量化，僅供音質測試。":"")+(gpuInfo&&!gpuInfo.f16?" 此裝置未確認 shader-f16 支援。":"");
}
const notes={base:"v1.0 · Kokoro JS 1.2.1；英文和西、法、印地、義、葡文共用權重（WASM q8 約 90 MB）。其他五語使用 uccharan Kokoro 音素處理（實驗）。",zh:"v1.1 中文專用模型 · @uzen/kokoro-js 1.2.4。100 個音色按需載入；建議 FP32、FP16、Q4F16，Q8/Q4 只供實驗。",ja:"v1.0 · kokoro-js-jp 0.2.0，首次日文另外下載約 24 MB 壓縮詞典。"};
function clearAudio(){try{speechSynthesis?.cancel();}catch{}player.pause();player.removeAttribute("src");player.hidden=true;player.load();if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl="";}
function renderLanguage(){
 const info=LANGUAGES[lang.value];
 voice.replaceChildren(...info.voices.map(id=>{const o=document.createElement("option");o.value=id;o.textContent=id.split("_")[1]+(id[1]==="f"?" · 女聲":" · 男聲");return o;}));
 voice.value=selectedVoices.get(lang.value)||info.voices[0];
 text.value=drafts.get(lang.value)??info.sample[0];text.lang=info.locale;
 $("#presets").replaceChildren(...info.sample.map((value,i)=>{const b=document.createElement("button");b.type="button";b.textContent=i===info.sample.length-1?"短句":value;b.addEventListener("click",()=>{text.value=value;clearAudio();});return b;}));
 $("#model-note").textContent=notes[info.route];
 renderModeOptions();
 status.textContent="選擇音色後按 Kokoro 播放。";
}
lang.addEventListener("change",()=>{drafts.set(previousLang,text.value);selectedVoices.set(previousLang,voice.value);previousLang=lang.value;clearAudio();renderLanguage();});
voice.addEventListener("change",()=>{clearAudio();status.textContent="已切換音色。";});
mode.addEventListener("change",()=>{clearAudio();renderModeStatus();status.textContent="已切換運算模式，按 Kokoro 才載入。";});
function value(){const v=text.value.trim();if(!v)throw Error("先輸入要念的文字。");return v;}
function fail(e){console.error(e);status.textContent="失敗："+(e instanceof Error?e.message:String(e));}
system.addEventListener("click",()=>{try{const v=value(),info=LANGUAGES[lang.value];if(!("speechSynthesis" in window))throw Error("此瀏覽器沒有系統 TTS");clearAudio();const u=new SpeechSynthesisUtterance(v);u.lang=info.locale;u.rate=Number(speed.value);speechSynthesis.speak(u);status.textContent="正在播放系統 TTS。";}catch(e){fail(e);}});
function onProgress(i){if(i?.status==="progress"&&Number.isFinite(i.progress)){progress.style.width=Math.max(0,Math.min(100,i.progress))+"%";status.textContent="下載模型："+i.file+" · "+Math.round(i.progress)+"%";}}
async function load(route,config){
 const {device,dtype}=config,key=sessionKey(route,config);
 if(active?.key===key)return active.tts;
 const previous=active;active=null;
 const previousModel=previous?.tts?.model??previous?.tts?.tts?.model;
 if(previousModel?.dispose)await previousModel.dispose();
 progress.style.width="0";status.textContent="載入 Kokoro runtime…";
 let tts;
 if(route==="zh"){
  const {KokoroTTS}=await import(ZH_URL);
  tts=await KokoroTTS.from_pretrained(ZH_MODEL,{device,dtype,voicePath:"https://huggingface.co/"+ZH_MODEL+"/resolve/main/voices",progress_callback:onProgress});
 }else if(route==="ja"){
  const {KokoroJP}=await import(JA_URL);
  tts=await KokoroJP.load({modelId:MODEL_ID,device,dtype});
 }else{
  const {KokoroTTS}=await import(KOKORO_URL);
  tts=await KokoroTTS.from_pretrained(MODEL_ID,{device,dtype,progress_callback:onProgress});
 }
 active={route,key,tts};runtime.textContent=modeLabel(config)+" · 已就緒";progress.style.width="100%";return tts;
}
// The stock phonemizer package ships English data only. Use the explicitly
// multilingual uccharan Kokoro profile, with pinned language packs.
const loadedG2P=new Map();
async function fetchG2PAsset(path){
 const res=await fetch(G2P_BASE+path);
 if(!res.ok)throw Error("發音資源 "+path+" HTTP "+res.status);
 return new Uint8Array(await res.arrayBuffer());
}
async function loadG2P(language){
 if(!g2pPromise)g2pPromise=(async()=>{
  const [mod,wasm]=await Promise.all([import(G2P_URL),fetchG2PAsset("dist/uccharan_wasm_bg.wasm")]);
  await mod.init({wasm});return mod;
 })().catch(e=>{g2pPromise=null;throw e;});
 const mod=await g2pPromise;
 if(!loadedG2P.has(language)){
  const pending=(async()=>{const pack=await fetchG2PAsset("data/"+language+".ucd");await mod.loadLanguage(language,pack);})().catch(e=>{loadedG2P.delete(language);throw e;});
  loadedG2P.set(language,pending);
 }
 await loadedG2P.get(language);return mod;
}
async function espeakGenerate(tts,info,v,selected,rate){
 const mod=await loadG2P(info.g2p);
 const p=String(mod.phonemizeSync(v,{lang:info.g2p,profile:"kokoro"})).trim();
 if(!p)throw Error("無有效音素");
 const {input_ids}=tts.tokenizer(p,{truncation:false});
 if(input_ids.dims.at(-1)>511||input_ids.dims.at(-1)<3)throw Error("音素數量不符，請縮短文字");
 return tts.generate_from_ids(input_ids,{voice:selected,speed:rate});
}
function setBusy(b){busy=b;lang.disabled=b;voice.disabled=b;speed.disabled=b;mode.disabled=b;text.readOnly=b;system.disabled=b;kokoro.disabled=b;for(const el of $("#presets").querySelectorAll("button"))el.disabled=b;}
kokoro.addEventListener("click",async()=>{
 if(busy)return;
 try{
  const v=value(),info=LANGUAGES[lang.value],selected=voice.value,rate=Number(speed.value);
  if(!info.voices.includes(selected))throw Error("語言與音色不符");
  clearAudio();setBusy(true);
  const started=performance.now(),config=resolveMode(info.route,mode.value,await probeGpu());
  const warm=active?.key===sessionKey(info.route,config),tts=await load(info.route,config),ready=performance.now();
  status.textContent="生成語音…"+(info.route==="ja"?"（初次含日文詞典準備）":"");
  const audio=info.route==="ja"?await tts.speak(v,selected,rate):info.g2p?await espeakGenerate(tts,info,v,selected,rate):await tts.generate(v,{voice:selected,speed:rate});
  const generated=performance.now();
  if(!audio?.audio?.length||!audio.audio.some(x=>Number.isFinite(x)&&x!==0)||!audio.audio.every(Number.isFinite))throw Error("模型未回傳有效聲音");
  const blob=audio.toBlob();if(!blob||blob.size<=44)throw Error("音訊檔案為空");
  objectUrl=URL.createObjectURL(blob);player.src=objectUrl;player.hidden=false;
  const timing=modeLabel(config)+" · "+(warm?"已載入":"模型準備")+" "+((ready-started)/1000).toFixed(2)+" 秒 · 生成 "+((generated-ready)/1000).toFixed(2)+" 秒";
  try{await player.play();status.textContent="播放中 · "+timing;}catch{status.textContent="生成完成，請按播放器播放 · "+timing;}
 }catch(e){fail(e);}finally{setBusy(false);}
});
window.addEventListener("pagehide",()=>clearAudio());
renderLanguage();
probeGpu().then(()=>{if(!busy)renderModeOptions();});
</script>
</body>
</html>
