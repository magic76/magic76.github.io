<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f7ff">
<title>Koolo TTS Lab · 六語語音試聽</title>
<style>
:root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; color: #18253a; background: #f5f7ff; }
* { box-sizing: border-box; }
body { margin: 0; min-width: 280px; font-size: 16px; }
main { max-width: 660px; padding: 26px 18px 60px; margin: auto; }
a { color: #395bc5; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 32px; }
.logo { text-decoration: none; color: #253555; font-weight: 800; letter-spacing: .04em; }
.pill { background: #e4ebff; border-radius: 999px; color: #314eac; padding: 7px 12px; font-size: 12px; font-weight: 700; }
h1 { font-size: clamp(30px, 8vw, 44px); letter-spacing: -.04em; line-height: 1.16; margin: 0 0 12px; }
.intro { color: #56657b; margin: 0 0 28px; line-height: 1.7; }
.panel { padding: 26px; border: 1px solid #dce4f2; border-radius: 24px; background: white; box-shadow: 0 14px 42px rgba(40, 62, 107, .07); }
label { display: block; font-weight: 750; margin-bottom: 9px; font-size: 14px; }
select, textarea { display: block; width: 100%; font: inherit; color: inherit; background: white; border: 1px solid #bbc9dc; border-radius: 13px; padding: 13px 14px; }
select { min-height: 48px; margin-bottom: 22px; }
textarea { min-height: 132px; resize: vertical; line-height: 1.55; }
select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid #809dff; outline-offset: 2px; }
.meta { display: flex; justify-content: space-between; gap: 10px; margin: 9px 0 20px; color: #5f6e83; font-size: 12px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
button { min-height: 48px; border-radius: 13px; border: 1px solid #c7d3e8; padding: 10px 14px; font-size: 15px; font-weight: 800; cursor: pointer; color: #2d4271; background: #eef3ff; }
button.primary { background: #405ed3; color: white; border-color: #405ed3; }
button:disabled { cursor: not-allowed; opacity: .48; }
.status { margin: 18px 0 0; padding: 13px 14px; border-radius: 12px; background: #eff3fb; font-size: 14px; line-height: 1.6; min-height: 50px; overflow-wrap: anywhere; }
.status.error { background: #fff0ec; color: #982b22; }
audio { display: block; width: 100%; margin-top: 16px; }
.note { color: #617089; font-size: 13px; line-height: 1.7; margin: 20px 3px; }
@media(max-width:420px) { main { padding: 20px 14px 44px; } .panel { padding: 18px; } .actions { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <nav class="nav" aria-label="導覽"><a class="logo" href="/">Koolo ✳</a><span class="pill">VOICE EXPERIMENT</span></nav>
  <h1>輸入一句話，<br>聽聽 AI 怎麼說。</h1>
  <p class="intro">試試中文、英文、日文、韓文、西班牙文和法文。這是獨立的語音品質試驗室，不會改動你原本的聊天體驗。</p>
  <section class="panel" aria-label="語音生成">
    <label for="lang">想聽哪種語言？</label>
    <select id="lang">
      <option value="zh">中文 Mandarin</option><option value="en">English</option><option value="ja">日本語</option>
      <option value="ko">한국어</option><option value="es">Español</option><option value="fr">Français</option>
    </select>
    <label for="text">要說什麼？</label>
    <textarea id="text" maxlength="300" spellcheck="true" aria-describedby="limit"></textarea>
    <div class="meta"><span id="limit">最多 300 字</span><span id="count">0 / 300</span></div>
    <div class="actions"><button id="play" type="button" class="primary">▶ 生成並播放</button><button id="download" type="button" disabled>↓ 下載 MP3</button></div>
    <p id="status" class="status" role="status" aria-live="polite">準備好了，按下播放就能試聽。</p>
    <audio id="audio" controls preload="none" hidden aria-label="語音試聽播放器"></audio>
  </section>
  <p class="note">由 Cloudflare Workers AI · MeloTTS 提供。生成時間受模型及網路影響；模型若已退役，會直接顯示錯誤，不會假裝生成成功。</p>
</main>
<script>
(() => {
  'use strict';
  const endpoint = 'https://koolo-tts.shanliyoung.workers.dev/tts';
  const examples = {
    zh: '背了十年單字，還是不敢開口？',
    en: "Hi, I'm Zoe! Want to practice English with me?",
    ja: 'こんにちは！今日は一緒に日本語を練習しましょう。',
    ko: '안녕하세요! 오늘 같이 한국어 연습해 볼까요?',
    es: '¡Hola! ¿Te gustaría practicar español conmigo?',
    fr: 'Bonjour ! Tu veux pratiquer le français avec moi ?',
  };
  const lang = document.querySelector('#lang');
  const text = document.querySelector('#text');
  const play = document.querySelector('#play');
  const download = document.querySelector('#download');
  const status = document.querySelector('#status');
  const audio = document.querySelector('#audio');
  const count = document.querySelector('#count');
  let objectUrl = null;
  let generating = false;
  let ready = false;
  const clearAudio = () => {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    audio.hidden = true;
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = null;
    ready = false;
    download.disabled = true;
  };
  const updateCount = () => {
    count.textContent = `${Array.from(text.value).length} / 300`;
    if (!generating) clearAudio();
  };
  const setStatus = (message, error = false) => {
    status.textContent = message;
    status.classList.toggle('error', error);
  };
  lang.addEventListener('change', () => {
    text.value = examples[lang.value];
    clearAudio(); updateCount();
    setStatus('已換成範例句，你也可以輸入自己的內容。');
  });
  text.addEventListener('input', updateCount);
  text.value = examples[lang.value];
  updateCount();
  play.addEventListener('click', async () => {
    if (generating) return;
    const message = text.value.trim();
    if (!message || Array.from(message).length > 300) {
      setStatus('請輸入 1～300 字的內容。', true); text.focus(); return;
    }
    clearAudio();
    generating = true; play.disabled = true; download.disabled = true;
    setStatus('正在生成語音…');
    const started = performance.now();
    try {
      const response = await fetch(endpoint, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: message, lang: lang.value }),
      });
      if (!response.ok) {
        const failure = await response.json().catch(() => ({}));
        throw new Error(`${failure.error || 'HTTP_' + response.status}（HTTP ${response.status}）`);
      }
      if (!response.headers.get('Content-Type')?.includes('audio/')) throw new Error('回傳內容不是音訊');
      const blob = await response.blob();
      if (!blob.size) throw new Error('語音檔案是空的');
      const seconds = ((performance.now() - started) / 1000).toFixed(2);
      objectUrl = URL.createObjectURL(blob);
      audio.src = objectUrl; audio.hidden = false;
      download.disabled = false; ready = true;
      setStatus(`生成完成 · ${seconds} 秒 · ${response.headers.get('X-TTS-Cache') === 'HIT' ? '快取命中' : '新生成'} · ${(blob.size / 1024).toFixed(1)} KB`);
      try { await audio.play(); } catch { setStatus(`生成完成 · ${seconds} 秒。請按下播放器的播放鍵。`); }
    } catch (error) {
      setStatus(`生成失敗：${error.message}。若模型已退役，需要改用其他語音服務。`, true);
    } finally { generating = false; play.disabled = false; }
  });
  download.addEventListener('click', () => {
    if (!ready || !objectUrl) return;
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = `koolo-tts-${lang.value}.mp3`;
    document.body.append(link); link.click(); link.remove();
  });
})();
</script>
</body>
</html>
