<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#f7f7f4" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/koolo-v2-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Koolo" />
  <!-- Apply before the JS/CSS bundle to prevent a visible scrollbar flash on first load. -->
  <style>
    html, body, #root, body *, #root * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
      scrollbar-gutter: auto !important;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar,
    body *::-webkit-scrollbar, #root::-webkit-scrollbar, #root *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }
  </style>
  <style id="koolo-boot-style">
    .koolo-boot-loader { display:none; position:fixed; inset:0; place-items:center; background:#f7f8f6; pointer-events:none; }
    #root:empty + .koolo-boot-loader, html.crew-dynamic-route .koolo-boot-loader { display:grid; }
    .koolo-boot-loader img { display:block; width:160px; height:64px; }
  </style>
  <title>Koolo</title>
</head>
<body>
  <div id="root"></div>
  <div class="koolo-boot-loader" role="status" aria-label="Koolo"><img src="/brand/koolo-loading.svg" width="160" height="64" alt="" /></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
