<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Crew Story</title><link rel="stylesheet" href="crew.css"></head><body><header class="topbar"><div class="shell inner"><a class="brand" href="index.html"><span class="brandmark">C</span><span>Crew</span></a><a class="status" data-gemini-status href="settings.html"><i class="status-dot"></i><span data-gemini-status-text>設定 Gemini</span></a></div></header>
<main class="shell page"><section class="hero"><span class="eyebrow"><i></i> Crew Story</span><h1>故事工作室</h1><p class="lead">先生成，再繼續改。這裡不是一次性故事按鈕。</p></section>
<div class="tabs"><button class="tab active" data-tab="create">建立故事</button><button class="tab" data-tab="edit">繼續加工</button><button class="tab" data-tab="history">歷史</button></div>
<section class="view active section" id="create"><div class="panel"><div class="two"><div><label class="label">主角</label><input class="field" id="hero" value="一隻怕水的小恐龍"></div><div><label class="label">場景</label><input class="field" id="place" value="會發光的海邊"></div></div><label class="label">一定要出現的東西</label><input class="field" id="item" value="一把會唱歌的雨傘"><div class="two"><div><label class="label">風格</label><select class="field" id="style"><option>溫暖</option><option>搞笑</option><option>冒險</option><option>懸疑</option><option>睡前故事</option></select></div><div><label class="label">長度</label><select class="field" id="length"><option>短</option><option selected>中等</option><option>長</option></select></div></div><div class="actions"><button class="btn" id="makeStory">生成故事</button><button class="btn secondary" id="random">幫我亂入</button></div><div class="result empty" id="storyResult">故事會出現在這裡。</div></div></section>
<section class="view section" id="edit"><div class="panel"><div class="notice"><div><b>目前故事</b><p id="currentHint">先生成一篇故事，再來續寫或改風格。</p></div></div><div class="actions"><button class="btn secondary" data-edit="續寫下一段，保留原本角色與語氣。">續寫</button><button class="btn secondary" data-edit="把整篇改得更幽默，但保留事件。">變搞笑</button><button class="btn secondary" data-edit="把故事縮短成約原本一半，保留轉折。">縮短</button><button class="btn secondary" data-edit="加入一個意外反轉，讓結尾更有記憶點。">加反轉</button></div><label class="label">自訂修改</label><input class="field" id="customEdit" placeholder="例如：把主角換成小機器人"><div class="actions"><button class="btn" id="customEditBtn">套用修改</button></div><div class="result empty" id="editResult">修改後版本會出現在這裡。</div></div></section>
<section class="view section" id="history"><div class="list" id="storyHistory"></div></section>
</main><nav class="bottom-nav"><div class="inner">
<a class="navitem " data-nav="home" href="index.html"><b>⌂</b><span>首頁</span></a>
<a class="navitem " data-nav="teacher" href="teacher.html"><b>A</b><span>語言</span></a>
<a class="navitem active" data-nav="story" href="story.html"><b>S</b><span>故事</span></a>
<a class="navitem " data-nav="fortune" href="fortune.html"><b>F</b><span>探索</span></a>
<a class="navitem " data-nav="settings" href="settings.html"><b>⚙</b><span>設定</span></a>
</div></nav><div class="toast" id="toast"></div><script src="crew.js"></script><script>
CrewAI.nav("story");var currentStory="";
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active")});document.querySelectorAll(".view").forEach(function(x){x.classList.remove("active")});b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active");if(b.dataset.tab==="history")renderHistory()}});
var q=new URLSearchParams(location.search).get("q");if(q)document.getElementById("item").value=q;
function storyPrompt(){var map={短:"180-250",中等:"350-500",長:"650-900"};return "請用繁體中文寫一篇 "+map[document.getElementById("length").value]+" 字左右的故事。\n主角："+document.getElementById("hero").value+"\n場景："+document.getElementById("place").value+"\n一定要出現："+document.getElementById("item").value+"\n風格："+document.getElementById("style").value+"\n要有明確轉折，不要說教，不要加標題，只輸出正文。"}
document.getElementById("makeStory").onclick=async function(){if(!CrewAI.requireKey())return;var res=document.getElementById("storyResult");CrewAI.busy(this,true,"創作中…");res.classList.remove("empty");res.textContent="正在寫故事…";try{currentStory=await CrewAI.call(storyPrompt(),{system:"你是 Crew Story 的故事作者，文字有畫面、節奏自然。",temperature:1,maxOutputTokens:1500});res.textContent=currentStory;document.getElementById("currentHint").textContent=currentStory.slice(0,80)+"…";CrewAI.historyAdd("story",{title:document.getElementById("hero").value,preview:currentStory.slice(0,120),full:currentStory})}catch(e){res.textContent="失敗：\n"+e.message}finally{CrewAI.busy(this,false)}};
var heroes=["一個把影子弄丟的小孩","一隻想當廚師的鯨魚","一台會害羞的機器人"],places=["沒有重力的圖書館","每天換顏色的森林","只在星期三出現的車站"],items=["一張會改寫明天的車票","一顆只說真話的石頭","一個裝得下月光的玻璃瓶"];function pick(a){return a[Math.floor(Math.random()*a.length)]}document.getElementById("random").onclick=function(){document.getElementById("hero").value=pick(heroes);document.getElementById("place").value=pick(places);document.getElementById("item").value=pick(items)};
async function editStory(instruction,btn){if(!currentStory){CrewAI.toast("先生成一篇故事");return}if(!CrewAI.requireKey())return;var res=document.getElementById("editResult");CrewAI.busy(btn,true,"修改中…");res.classList.remove("empty");try{currentStory=await CrewAI.call("原故事：\n"+currentStory+"\n\n修改要求："+instruction+"\n只輸出修改後完整故事。",{system:"你是故事編輯，保留好的部分，只改使用者要求的地方。",temperature:.9,maxOutputTokens:1600});res.textContent=currentStory;document.getElementById("storyResult").textContent=currentStory;CrewAI.historyAdd("story",{title:"修改後故事",preview:currentStory.slice(0,120),full:currentStory})}catch(e){res.textContent="失敗：\n"+e.message}finally{CrewAI.busy(btn,false)}}
document.querySelectorAll("[data-edit]").forEach(function(b){b.onclick=function(){editStory(b.dataset.edit,b)}});document.getElementById("customEditBtn").onclick=function(){var v=document.getElementById("customEdit").value.trim();if(!v){CrewAI.toast("先輸入修改要求");return}editStory(v,this)};
function renderHistory(){var a=CrewAI.historyGet("story"),el=document.getElementById("storyHistory");el.innerHTML=a.length?a.map(function(x,i){return '<button class="list-item" data-i="'+i+'"><div><strong>'+CrewAI.esc(x.title)+'</strong><small>'+CrewAI.esc(x.preview)+'</small></div><span>›</span></button>'}).join(""):'<div class="notice"><div><b>還沒有故事</b><p>生成後會保存在這台裝置。</p></div></div>';el.querySelectorAll("button").forEach(function(b){b.onclick=function(){var x=a[Number(b.dataset.i)];currentStory=x.full||x.preview;document.getElementById("storyResult").textContent=currentStory;document.querySelector('[data-tab="create"]').click();CrewAI.toast("已載入故事")}})}
</script></body></html>
