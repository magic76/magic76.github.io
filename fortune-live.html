<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f4">
<title>Crew Fortune · 老師</title>
<link rel="stylesheet" href="features/shared/design-system.css?v={{ site.github.build_revision }}"><link rel="stylesheet" href="features/fortune/styles.css?v={{ site.github.build_revision }}">
</head><body class="fortune-theme session-page">
<header class="app-header"><div class="shell inner"><div class="app-brand"><a class="back-btn" href="fortune.html" aria-label="回 Crew Fortune">‹</a><div class="app-title"><strong>命理老師</strong><small>Crew Fortune</small></div></div><a class="status" data-gemini-status href="settings.html"><i class="status-dot"></i><span data-gemini-status-text>設定 Gemini</span></a></div></header>
<main class="session-shell">
<section class="session-person"><div class="avatar">F</div><h1>命理老師</h1><p>先看固定結果，再談你真正想問的事。</p></section>
<section class="live-stage" id="liveStage" data-state="idle">
<div class="live-top"><span id="liveBadge">READY</span><span id="liveModel">Live teacher</span></div>
<h2 class="live-title">白話追問</h2><p class="live-sub">若你剛從正式結果頁過來，老師會直接沿用那份計算結果。</p>
<div class="live-orb"><span>F</span></div><div class="live-status" id="liveStatus">填好基本資料後開始對話。</div>
<div class="live-controls"><button class="live-btn" id="startLive">開始對話</button><button class="live-btn end" id="stopLive" hidden>結束</button></div>
<div class="live-callbar"><div class="live-timer" id="liveTimer">0:00</div><div class="live-call-actions"><button class="live-tool-btn" id="muteLive" hidden>麥克風靜音</button><button class="live-tool-btn" id="interruptLive" hidden>打斷老師</button></div><label class="live-volume">音量 <input id="liveVolume" type="range" min="0" max="100" value="100"><span id="liveVolumeValue">100%</span></label></div>
<div class="live-presets"><button data-live-prompt="請直接講我現在工作上最值得注意的一件事，講完讓我追問。">工作</button><button data-live-prompt="請用務實的方式談最近的財務節奏，不要提供投資指令。">財運</button><button data-live-prompt="請談談接下來一個月最適合把力氣放在哪裡。">近一個月</button><button data-live-prompt="請反過來問我一個關鍵問題，幫你更精準理解我現在卡住的地方。">問我</button></div>
<details class="live-settings" id="fortuneSettings"><summary>出生資料與老師設定</summary><div class="live-setup-grid">
<div><label class="label">稱呼（選填）</label><input class="field" id="profileName" placeholder="例如：Liyang"></div>
<div><label class="label">出生日期</label><input class="field" id="birth" type="date"></div>
<div><label class="label">出生時間（選填）</label><input class="field" id="birthTime" type="time"></div>
<div><label class="label">出生城市（選填）</label><input class="field" id="city" placeholder="例如：新北市"></div>
<div><label class="label">今天想聊</label><select class="field" id="focus"><option>工作</option><option>財運</option><option>家庭</option><option>關係</option><option>整體</option><option>未來一年</option></select></div>
<div><label class="label">回答方式</label><select class="field" id="tone"><option value="direct">直接、有重點</option><option value="gentle">溫和提醒</option><option value="evidence">驗證式 · 多問背景</option></select></div>
<div><label class="label">老師音色</label><select class="field" id="voice"><option value="Charon">Charon</option><option value="Kore">Kore</option><option value="Aoede">Aoede</option><option value="Puck">Puck</option><option value="Fenrir">Fenrir</option></select></div>
<div style="display:flex;align-items:end"><button class="continue-last" id="continueLast" hidden>繼續上次對話</button></div></div><div class="pref-note">出生資料與偏好只保存在這台裝置。娛樂與自我反思用途。</div></details>
<div class="live-transcript"><div class="live-line user" id="userLine"><small>你</small><span></span></div><div class="live-line" id="aiLine"><small>老師</small><span></span></div></div>
<details class="live-history"><summary><span>完整對話</span><span>逐輪保留</span></summary><div class="live-history-actions"><button class="live-tool-btn" id="copyTranscript">複製全部</button></div><div class="live-history-list" id="liveTranscriptList"></div></details><div class="live-note">不要把回答當成醫療、法律、投資或重大人生決策依據。</div>
</section>
<details class="secondary-zone"><summary>文字整理</summary><div class="panel" style="margin-top:10px"><label class="label">想問什麼？</label><textarea class="field" id="textQ" placeholder="例如：最近工作有點卡，我該先看哪個方向？"></textarea><div class="actions"><button class="btn secondary" id="textAsk">整理</button></div><div class="result empty" id="textResult">不方便說話時再使用。</div></div></details>
</main><div class="toast" id="toast"></div>
<script src="crew.js?v={{ site.github.build_revision }}"></script><script src="crew-live.js?v={{ site.github.build_revision }}"></script><script src="crew-live-ui.js?v={{ site.github.build_revision }}"></script><script src="features/fortune/live/page.js?v={{ site.github.build_revision }}"></script>
</body></html>
