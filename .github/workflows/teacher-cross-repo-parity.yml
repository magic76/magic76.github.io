name: Crew Teacher cross-repo parity

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-android-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Web behavior and latest Android contract
        run: node scripts/verify-teacher-contract.cjs --upstream
        env:
          CREW_CONTRACT_READ_TOKEN: ${{ secrets.CREW_CONTRACT_READ_TOKEN }}
      - name: Validate shared payload and event contract against Android
        run: node scripts/verify-teacher-interfaces.cjs --upstream
        env:
          CREW_CONTRACT_READ_TOKEN: ${{ secrets.CREW_CONTRACT_READ_TOKEN }}
