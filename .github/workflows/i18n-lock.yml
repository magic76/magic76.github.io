name: Prepare i18n lockfile
on:
  push:
    branches: ["feat/web-i18n-foundation"]
    paths: ["package.json", ".npmrc", ".github/workflows/i18n-lock.yml"]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-i18n-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(i18n): lock i18next dependency versions"
          git pull --rebase origin feat/web-i18n-foundation
          git push origin HEAD:feat/web-i18n-foundation
