name: Crew Shorts Pages publish

on:
  push:
    branches: [master]
    paths:
      - "content/crew-shorts/approved/**"
      - ".github/workflows/crew-shorts-pages.yml"
      - "tests/shorts-feed.test.js"
      - "scripts/check-shorts-inventory.mjs"
      - "scripts/publish-shorts-pages.mjs"
      - "scripts/shorts-v2.mjs"
      - "scripts/content-hub.mjs"
      - "scripts/check-content-hub.mjs"
  pull_request:
    paths:
      - "content/crew-shorts/approved/**"
      - "content/schemas/**"
      - "scripts/publish-shorts-pages.mjs"
      - "scripts/shorts-v2.mjs"
      - "scripts/content-hub.mjs"
      - "scripts/check-content-hub.mjs"
      - "tests/content-hub.test.js"
      - "web-spa/src/teacher/shortsFeed.ts"
      - "web-spa/src/teacher/ShortsPage.tsx"
      - ".github/workflows/crew-shorts-pages.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate approved posts without committing"
        type: boolean
        required: true
        default: true
      as_of:
        description: "Optional editorial release date YYYY-MM-DD (Asia/Taipei)"
        type: string
        required: false
        default: ""
  # Publish approved stories once after 08:00 Taipei; retry manually if needed.
  # Off the UTC top-of-hour to avoid GitHub's busiest scheduler minute.
  schedule:
    - cron: "17 0 * * *" # 08:17 Asia/Taipei

permissions:
  contents: write

concurrency:
  group: crew-shorts-pages-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate all approved stories and WebP (any queue length)
        shell: bash
        run: |
          set -euo pipefail
          # Dry-run through the latest queued date to verify *every* approved image.
          # Never depend on the original 15-post seed count or a fixed calendar date.
          last_day=$(node -e 'const {posts}=require("./content/crew-shorts/approved/posts.json"); if(!posts?.length)process.exit(1); console.log(posts.map(p=>p.publishedAt?.slice(0,10)).sort().at(-1))')
          node scripts/publish-shorts-pages.mjs --feed content/crew-shorts/approved/posts.json --as-of "$last_day" --dry-run > /tmp/crew-shorts-preflight.txt
          if grep -F "DRY RUN:" /tmp/crew-shorts-preflight.txt; then
            :
          elif grep -F "No feed changes:" /tmp/crew-shorts-preflight.txt; then
            echo "Approved source already matches the checked-in published feed."
          else
            cat /tmp/crew-shorts-preflight.txt
            exit 1
          fi
      - run: node scripts/check-content-hub.mjs
      - run: npm ci
      - run: npm run check:web
      - run: npm test

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify reviewed seed exists
        run: |
          test -f content/crew-shorts/approved/posts.json || {
            echo "::error::Original approved Crew Shorts content and WebP files must be imported first."
            exit 1
          }
      - name: Warn before the approved content queue runs out
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: node scripts/check-shorts-inventory.mjs
      - name: Prepare release (or dry run)
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          INPUT_AS_OF: ${{ inputs.as_of || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--feed content/crew-shorts/approved/posts.json --out-dir features/teacher/shorts)
          if [[ -n "$INPUT_AS_OF" ]]; then args+=(--as-of "$INPUT_AS_OF"); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          node scripts/publish-shorts-pages.mjs "${args[@]}"
      - name: Validate published feed without unrelated Web build dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        run: |
          set -euo pipefail
          # The publisher has already validated the approved WebP bytes and story metadata.
          # Keep daily delivery independent from npm installs or unrelated SPA test failures.
          node scripts/check-shorts-feed.mjs features/teacher/shorts/posts.json
          node scripts/check-content-hub.mjs
          echo "Approved Crew Shorts feed validated." >> "$GITHUB_STEP_SUMMARY"
      - name: Commit to Git-connected Cloudflare Pages source
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- features/teacher/shorts
          if git diff --cached --quiet; then
            echo "Crew Shorts content unchanged; skipping deploy."
            exit 0
          fi
          git commit -m "content(shorts): publish approved daily photo stories"
          # Only new content paths are staged; fail on conflicts instead of overwriting work.
          git pull --rebase origin master
          git push origin HEAD:master
          echo "Published content commit. Cloudflare Pages Git integration should deploy this push."
