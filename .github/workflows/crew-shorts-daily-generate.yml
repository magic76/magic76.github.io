name: Crew Shorts AI generate (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan (free), preview (real photos in Artifact), publish (AI generation + Pages update)'
        type: choice
        options: [plan, preview, publish]
        required: true
        default: plan
      date:
        description: 'Optional Taipei editorial date YYYY-MM-DD. An approved-story private preview can use a future seeded date.'
        type: string
        required: false
        default: ''
      friend:
        description: 'Preview one Friend, or all five. Single-friend mode never publishes.'
        type: choice
        options: [all, bella, zoe, hugo, theo, yuna]
        required: true
        default: all
      use_approved_story:
        description: 'Preview the existing approved story (e.g., Bella on 2026-10-17), without generating another caption.'
        type: boolean
        required: false
        default: false
      preview_story_json:
        description: 'Optional single-friend draft JSON for a private preview up to 30 days ahead; not for publishing.'
        type: string
        required: false
        default: ''

permissions:
  contents: write

# Prevent a generated approved batch racing against the separate Pages publisher.
concurrency:
  group: crew-shorts-pages-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photo encoder
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==12.0.0'
      - name: Plan, generate, review and stage batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHORTS_TEXT_MODEL: ${{ vars.SHORTS_TEXT_MODEL || 'gemini-2.5-flash' }}
          SHORTS_IMAGE_MODEL: ${{ vars.SHORTS_IMAGE_MODEL || 'gemini-2.5-flash-image' }}
          RUN_MODE: ${{ inputs.mode }}
          INPUT_DATE: ${{ inputs.date || '' }}
          INPUT_FRIEND: ${{ inputs.friend || 'all' }}
          USE_APPROVED_STORY: ${{ inputs.use_approved_story || 'false' }}
          PREVIEW_STORY_JSON: ${{ inputs.preview_story_json || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--mode "$RUN_MODE")
          if [[ -n "$INPUT_DATE" ]]; then args+=(--date "$INPUT_DATE"); fi
          if [[ "$INPUT_FRIEND" != "all" ]]; then args+=(--friend "$INPUT_FRIEND"); fi
          if [[ "$USE_APPROVED_STORY" == "true" ]]; then args+=(--use-approved-story); fi
          if [[ -n "$PREVIEW_STORY_JSON" ]]; then args+=(--preview-story-json "$PREVIEW_STORY_JSON"); fi
          node scripts/generate-shorts-daily.mjs "${args[@]}"
      - name: Validate published JSON and all tests before a source commit
        if: inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-shorts-pages.mjs
          node scripts/check-shorts-feed.mjs features/teacher/shorts/posts.json
          npm ci
          npm run check:web
          npm test
      - name: Commit approved photos and due public feed
        if: inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- content/crew-shorts/approved features/teacher/shorts
          if git diff --cached --quiet; then
            echo 'Crew Shorts AI: no new approved posts or due feed changes; no commit.'
            exit 0
          fi
          git commit -m 'content(shorts): generate verified daily AI photo stories'
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Upload generated stories, images and QA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crew-shorts-daily-${{ github.run_id }}
          path: crew-shorts-preview/
          if-no-files-found: warn
          retention-days: 14
      - name: Where to inspect this job
        if: always()
        shell: bash
        run: |
          echo '## Crew Shorts AI generation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Find Artifact `crew-shorts-daily-${{ github.run_id }}` below this Actions run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'It contains manifest.json and either one selected Friend WebP or five independent WebPs on success.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Plan mode makes no API calls. Private preview can use one human-authored draft up to 30 days ahead, generates only that Friend (costs Gemini image and QA calls), and never commits. Publish mode requires all five to pass strict identity QA.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Published feed: https://www.3sssi.com/features/teacher/shorts/posts.json' >> "$GITHUB_STEP_SUMMARY"