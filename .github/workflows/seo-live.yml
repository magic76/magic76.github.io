name: Production SEO smoke

# Audit actual Cloudflare Pages HTML, not only local SSG fixtures. One weekly
# run plus a one-time run when the checker changes. Manual replay is available.
on:
  push:
    branches: [master]
    paths:
      - scripts/check-live-seo.mjs
      - .github/workflows/seo-live.yml
  workflow_dispatch:
  schedule:
    - cron: '35 1 * * 1'

permissions:
  contents: read

concurrency:
  group: production-seo-smoke
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test SEO audit assertions (offline)
        run: node --test tests/seo-live.test.js
      - name: Audit live Cloudflare Pages responses
        run: node scripts/check-live-seo.mjs
