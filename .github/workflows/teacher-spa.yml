name: Teacher SPA build

on:
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-package-lock
      - run: npm run check:teacher
      - run: npm run build:teacher
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-app
          path: teacher-app
