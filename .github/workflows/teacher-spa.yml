name: Crew SPA build

on:
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run check:web
      - run: npm run build:web
      - run: npm test
      - name: Commit Crew Pages build
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A crew-app package-lock.json
          if git diff --cached --quiet; then
            echo "Crew build already current"
          else
            git commit -m "build: update Crew SPA"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: crew-app
          path: crew-app
