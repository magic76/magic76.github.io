name: Crew Briefing daily
on:
  # Validate the new/updated scheduled workflow as soon as it lands on master.
  push:
    branches: [master]
    paths:
      - ".github/workflows/crew-briefing-daily.yml"
      - "scripts/briefing-research-axes.mjs"
      - "scripts/briefing-public-sources.mjs"
      - "scripts/generate-briefing.mjs"
      - "scripts/research-quality.mjs"
  schedule:
    - cron: "53 22 * * *" # 06:53 Asia/Taipei (UTC+8); deliver around 07:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crew-briefing-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Generate from public sources only
        run: node scripts/generate-briefing.mjs
        env:
          CREW_BRIEFING_GEMINI_KEY: ${{ secrets.CREW_BRIEFING_GEMINI_KEY }}
          CREW_BRIEFING_MODEL: gemini-2.5-flash
          CREW_BRIEFING_GITHUB_TOKEN: ${{ github.token }}
      - run: npm run check:web
      - run: npm run build:web
      - name: Report research SEO eligibility
        run: node scripts/research-quality-report.mjs
      - run: npm test
      - name: Commit the report and compiled site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-spa/public/briefings crew-app
          if git diff --cached --quiet; then
            echo "Crew Briefing is already current"
          else
            git commit -m "chore(briefing): publish daily public report"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
