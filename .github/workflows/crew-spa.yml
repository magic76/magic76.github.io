name: Crew SPA build

on:
  push:
    branches:
      - master
    # A generated crew-app-only commit needs no second CI build.
    paths-ignore:
      - "crew-app/**"
      - "docs/**"
      - "**/AGENTS.md"
  # Feature and fix branches are validated once when opened/updated as PRs.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'crew-app/**'
      - 'docs/**'
      - '**/*.md'

# Cancel checks for old PR heads, but never interrupt master publishing.
concurrency:
  # All master pushes share one lane; each PR retains its own independently cancellable lane.
  group: crew-spa-${{ github.event_name == 'push' && 'master' || github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    # The visual-only mobile-home PR needs Playwright 1.56's supported image.
    # Every other PR and master push keep their original runner.
    runs-on: ${{ github.event_name == 'pull_request' && ((contains(github.event.pull_request.head.ref, 'mobile-home-phone-phase1') || contains(github.event.pull_request.head.ref, 'mobile-home-timeline-scenarios-shortcuts')) || (contains(github.event.pull_request.head.ref, 'mobile-home-hero-editorial-v3') || contains(github.event.pull_request.head.ref, 'mobile-hero-compact-first-screen') || (contains(github.event.pull_request.head.ref, 'desktop-home-stage-alignment') || contains(github.event.pull_request.head.ref, 'koolo-desktop-home-alignment')))) && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify Web contract matches Android source of truth
        run: node scripts/verify-teacher-contract.cjs --upstream
        env:
          CREW_CONTRACT_READ_TOKEN: ${{ secrets.CREW_CONTRACT_READ_TOKEN }}
      - name: Validate shared role, Shorts and event contracts
        run: node scripts/verify-teacher-interfaces.cjs --upstream
        env:
          CREW_CONTRACT_READ_TOKEN: ${{ secrets.CREW_CONTRACT_READ_TOKEN }}
      - run: npm ci
      # This blocking fix needs case-by-case full-suite parity with the exact
      # PR base, before either worktree generates build-version timestamps.
      - name: Compare npm test failures against master (scoped fixes)
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'cloudflare-two-stylesheets') || (contains(github.event.pull_request.head.ref, 'fortune-lab-resumable') || (contains(github.event.pull_request.head.ref, 'fortune-lab-plain') || (contains(github.event.pull_request.head.ref, 'fortune-lab-fast') || (contains(github.event.pull_request.head.ref, 'fortune-report-reader') || contains(github.event.pull_request.head.ref, 'fortune-reader-3d')))))) || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chatgpt/kokoro-lab-en')
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          base_dir="$RUNNER_TEMP/koolo-cloudflare-master"
          git worktree add --detach "$base_dir" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$base_dir/node_modules"
          (cd "$base_dir" && npm test) > "$RUNNER_TEMP/koolo-base-test.log" 2>&1 || true
          npm test > "$RUNNER_TEMP/koolo-head-test.log" 2>&1 || true
          for snapshot in base head; do
            log="$RUNNER_TEMP/koolo-${snapshot}-test.log"
            if ! grep -Eq '^# tests [0-9]+' "$log"; then
              echo "::error::npm test did not produce a complete TAP summary: $snapshot"
              tail -60 "$log"
              exit 1
            fi
            (grep -E '^[[:space:]]*not ok [0-9]+ - ' "$log" || true) |
              sed -E 's/^[[:space:]]*not ok [0-9]+ - //' |
              LC_ALL=C sort -u > "$RUNNER_TEMP/koolo-${snapshot}-failures.txt"
          done
          echo "Base failed cases: $(wc -l < "$RUNNER_TEMP/koolo-base-failures.txt")"
          echo "PR failed cases: $(wc -l < "$RUNNER_TEMP/koolo-head-failures.txt")"
          LC_ALL=C comm -13 "$RUNNER_TEMP/koolo-base-failures.txt" "$RUNNER_TEMP/koolo-head-failures.txt" > "$RUNNER_TEMP/koolo-new-failures.txt"
          if [ -s "$RUNNER_TEMP/koolo-new-failures.txt" ]; then
            echo "::error::New npm test failures not present on master:"
            cat "$RUNNER_TEMP/koolo-new-failures.txt"
            exit 1
          fi
          if [ "${{ github.event.pull_request.head.ref }}" = "chatgpt/kokoro-lab-en" ] && ! cmp -s "$RUNNER_TEMP/koolo-base-failures.txt" "$RUNNER_TEMP/koolo-head-failures.txt"; then
            echo "::error::Unique npm test failure names differ from master"
            exit 1
          fi
          echo "PASS: 0 new failing cases vs master; full npm test runs finished before the builds"
      - name: Validate Kokoro learning speech regression tests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chatgpt/kokoro-lab-en'
        run: node --test tests/chat-recall.test.js tests/text-chat-learning.test.js tests/learning-speech-phrases.test.js tests/learning-speech-multilingual.test.js tests/learning-speech-cache.test.js
      - name: Typecheck PR
        if: github.event_name == 'pull_request'
        run: npm run check:web
      # The default PR lane is intentionally light. Only test-regression repair
      # branches run the full suite before the PR is merged.
      # Keep Japanese-native English learning regression coverage in the light PR lane.
      - name: Validate first-Learn language confirmation
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'learn-language-')
        run: node --test tests/crew-learn-first-language-gate.test.js tests/crew-onboarding.test.js tests/teacher-target-languages.test.js tests/crew-friend-language-lock.test.js
      - name: Validate Japanese English learning flow
        if: github.event_name == 'pull_request'
        run: node --test tests/teacher-japanese-english-onboarding.test.js
      # Game-end handoffs share the starter UI with daily topics and Shorts;
      # verify these existing opt-in paths when this feature changes.
      - name: Validate game-end and existing starter handoffs
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'game-end-')
        run: node --test tests/daily-topic-cards.test.js tests/shorts-post-starter.test.js tests/shorts-text-first-reply.test.js tests/game-end-12.test.js
      - name: Full regressions (test repair PRs only)
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'test-regressions') || contains(github.event.pull_request.head.ref, 'fix/reliability-'))
        run: npm test
      # Short, offline-only fixture tests on Shorts PRs; no Gemini calls or full-suite cost.
      - name: Validate Crew Shorts generator and review pipeline (Shorts PRs only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'shorts-')
        run: node --test tests/shorts-daily-generator.test.js tests/shorts-agent-pipeline.test.js
      - name: Validate isolated guest trial backend and existing Live transport (guest PRs only)
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'guest-trial') || contains(github.event.pull_request.head.ref, 'guest-qa') || contains(github.event.pull_request.head.ref, 'guest-native') || contains(github.event.pull_request.head.ref, 'guest-multi') || contains(github.event.pull_request.head.ref, 'guest-auth-quota') || contains(github.event.pull_request.head.ref, 'guest-live') || contains(github.event.pull_request.head.ref, 'member-daily'))
        run: node --test tests/guest-trial.test.js tests/crew-guest-config-cache.test.js tests/crew-ux-p0-honest-trial.test.js tests/crew-ux-p0b-followup.test.js tests/crew-live.lifecycle.test.js tests/crew-onboarding.test.js
      - name: Validate keyless Teacher/Friend text and legacy guest Live (guest-text PRs only)
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'guest-text') || contains(github.event.pull_request.head.ref, 'text-chat-recovery') || contains(github.event.pull_request.head.ref, 'live-keyboard') || contains(github.event.pull_request.head.ref, 'live-text-v1beta') || contains(github.event.pull_request.head.ref, 'false-quota'))
        run: node --test tests/guest-text-chat.test.js tests/guest-trial.test.js tests/short-chat-memory.test.js tests/crew-guest-config-cache.test.js tests/crew-live.lifecycle.test.js tests/crew-live-text-stream.test.js
      - name: Validate Fortune report quality (Fortune PRs only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'fortune-')
        run: node --test tests/fortune-ai-quality.test.js tests/fortune-report-depth.test.js tests/fortune-usefulness-a.test.js tests/fortune-usefulness-b.test.js tests/fortune-identity.test.js tests/fortune-mode-covers.test.js tests/fortune-tarot-artwork.test.js tests/fortune-share-cards.test.js tests/fortune-daily-card.test.js
      - name: Validate private Fortune Lab API, PWA errors and bounded Gemini generation
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'fortune-lab')
        run: node --test tests/fortune-private-report-lab.test.mjs tests/fortune-lab-incremental.test.mjs
      - name: Verify Cloudflare build for resumable Fortune Lab
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'fortune-lab-resumable') || (contains(github.event.pull_request.head.ref, 'fortune-lab-plain') || (contains(github.event.pull_request.head.ref, 'fortune-lab-fast') || (contains(github.event.pull_request.head.ref, 'fortune-report-reader') || contains(github.event.pull_request.head.ref, 'fortune-reader-3d')))))
        run: |
          npm run build:cloudflare
          npm run test:cloudflare
          npm run check:bundle
      - name: Validate ECPay sandbox order and callback security (ECPay PRs only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'ecpay-stage')
        run: node --test tests/koolo-ecpay-stage.test.mjs tests/fortune-paid-reports.test.mjs
      # TTS failure diagnostics are part of production publishing reliability.
      # This test is offline and makes no paid Gemini calls.
      - name: Validate Video TTS failure handling
        if: github.event_name == 'pull_request'
        run: node --test tests/video-tts.test.mjs
      - name: Validate first-party usage analytics contract
        run: node --test tests/crew-usage.test.js
      - name: Validate secure Cloudflare D1 feedback submission
        run: node --test tests/crew-feedback.test.js
      - name: Validate Telegram feedback notification safety
        run: node --test tests/crew-feedback-telegram.test.js
      - name: Validate private feedback inbox authentication and D1 review actions
        run: node --test tests/crew-feedback-admin.test.js
      # Quick homepage widget contract; always run for PRs and main to prevent regressions.
      - name: Validate home Live bubble
        run: node --test tests/crew-home-live-bubble.test.js
      - name: Validate OAuth sign-in security (auth PRs only)
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'crew-auth') || contains(github.event.pull_request.head.ref, 'guest-auth-quota') || contains(github.event.pull_request.head.ref, 'member-daily'))
        run: node --test tests/crew-auth.test.js
      - name: Validate Crew Magic world and Live tools (Magic PRs only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'magic')
        run: node --test tests/magic-world.test.js tests/magic-live-composition.test.js tests/magic-navigation.test.js
      - name: Validate Koolo dual-origin migration safety
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'koolo-domain') || contains(github.event.pull_request.head.ref, 'koolo-trial-worker-domain'))
        run: node --test tests/koolo-domain-ready.test.js tests/crew-auth.test.js tests/guest-trial.test.js tests/guest-text-chat.test.js
      - name: Validate Koolo trial Worker endpoint routing
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'koolo-frontend-guest-api')
        run: node --test tests/koolo-trial-endpoint.test.js tests/crew-guest-config-cache.test.js tests/guest-text-chat.test.js
      - name: Validate UI translations (offline)
        run: npm run check:i18n
      - name: Review newly added UI literals (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
          node scripts/check-ui-locales.mjs --changed-ui
        env:
          UI_I18N_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - run: npm run build:web
      - run: npm run check:bundle
      # Deployment-adapter fixes require the real Cloudflare build, not only
      # build:web. Keep the heavier gate scoped to this blocking-fix PR.
      - name: Validate Cloudflare Pages deployment adapter (blocking fix)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'cloudflare-two-stylesheets')
        run: |
          npm run build:cloudflare
          npm run test:cloudflare
      - name: Validate Crew PWA safety and Cloudflare artifacts (PWA PRs only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'pwa-')
        run: |
          node --test tests/crew-pwa.test.js
          npm run build:cloudflare
          npm run test:cloudflare
      - name: Validate Fortune share OG output (Fortune sharing PRs only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'fortune-sharing')
        run: |
          npm run build:cloudflare
          npm run test:cloudflare
      - name: Validate Cloudflare prerender and sitemap (SEO PRs only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'seo-')
        run: |
          node --check scripts/seo-lastmod.mjs
          node --test tests/seo-lastmod-source.test.js
          npm run build:cloudflare
          npm run test:cloudflare
          node --test tests/intent-seo.test.js
          node --test tests/seo-live.test.js
          node --test tests/seo-pages.test.js
          node --test tests/seo-ctr.test.js
          node --test tests/koolo-seo-cutover.test.js
      # Manual-review visual proof for the mobile homepage phase-1 PR only.
      # Desktop home visual proof. Build master in a separate worktree and verify
      # 390/360 phone screenshots are pixel-identical to the base branch.
      - name: Desktop home alignment screenshots and mobile master parity
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'desktop-home-stage-alignment') || contains(github.event.pull_request.head.ref, 'koolo-desktop-home-alignment'))
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund --ignore-scripts playwright@1.56.1 pngjs@7.0.0
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          node --test tests/koolo-desktop-home.test.js tests/desktop-home-stage.test.js tests/mobile-home-phase1.test.js tests/crew-home-live-bubble.test.js
          npm run build:cloudflare
          npm run test:cloudflare
          git fetch --no-tags --depth=1 origin 0357f26cffd92c895f2abe20ccbca0eac1b905e1
          git worktree add --detach ../crew-master-visual 0357f26cffd92c895f2abe20ccbca0eac1b905e1
          ln -s "$GITHUB_WORKSPACE/node_modules" ../crew-master-visual/node_modules
          (cd ../crew-master-visual && npm run build:cloudflare)
          node scripts/screenshot-desktop-home-stage.mjs ../crew-master-visual/dist
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'desktop-home-stage-alignment')
        with:
          name: desktop-home-stage-review
          path: artifacts/desktop-home-stage/*
          retention-days: 14
          if-no-files-found: warn
      # Screenshots are CI artifacts; nothing gets merged or published.
      - name: Browser screenshots for mobile home review
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'mobile-home-phone-phase1') || contains(github.event.pull_request.head.ref, 'mobile-home-timeline-scenarios-shortcuts'))
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund --ignore-scripts playwright@1.56.1
          npx playwright install chromium
          # Hosted images do not guarantee CJK glyphs; screenshot review must show readable zh-TW.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          node --test tests/mobile-home-phase1.test.js tests/crew-home-live-bubble.test.js tests/crew-home-interaction-first.test.js tests/crew-onboarding.test.js
          npm run build:cloudflare
          npm run test:cloudflare
          node scripts/screenshot-mobile-home.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'mobile-home-phone-phase1') || contains(github.event.pull_request.head.ref, 'mobile-home-timeline-scenarios-shortcuts'))
        with:
          name: mobile-home-phase1-screenshots
          path: artifacts/mobile-home-qa/*
          retention-days: 7
          if-no-files-found: warn
      # Mobile hero v3 design-review proof. The PR is draft; never deploy/merge from this step.
      - name: Mobile hero v3 screenshots and motion video
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'mobile-home-hero-editorial-v3') || contains(github.event.pull_request.head.ref, 'mobile-hero-compact-first-screen'))
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund --ignore-scripts playwright@1.56.1
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          node --test tests/mobile-home-hero-v3.test.js tests/mobile-home-phase1.test.js
          npm run build:cloudflare
          npm run test:cloudflare
          node scripts/screenshot-mobile-hero-v3.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'mobile-home-hero-editorial-v3') || contains(github.event.pull_request.head.ref, 'mobile-hero-compact-first-screen'))
        with:
          name: mobile-home-hero-v3-review
          path: artifacts/mobile-home-hero-v3/*
          retention-days: 14
          if-no-files-found: warn
      # Magic changes require real WebGL evidence, including the 390px sculpted
      # robot/fox/dragon close-ups produced by smoke-magic-creator-browser.mjs.
      - name: Real browser snapshot of Crew Magic 3D (Magic PRs only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'magic')
        run: |
          npm run build:cloudflare
          node scripts/smoke-magic-creator-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'magic')
        with:
          name: magic-creator-browser-screenshots
          path: artifacts/magic-creator-*
          if-no-files-found: ignore
      - name: Browser-render Crew Town 3D (town PRs only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'town')
        run: |
          node --test tests/crew-town-3d.test.js tests/crew-town-navigation.test.js
          npm run build:cloudflare
          node scripts/smoke-town-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'town')
        with:
          name: town-browser-smoke
          path: artifacts/town-browser.*
          if-no-files-found: ignore
      - name: Commit Crew Pages build
        if: github.event_name == 'push' && github.ref_name == 'master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Generated hashed assets cannot be safely rebased across distinct builds.
          # A newer master push has its own queued run, so skip stale output.
          git fetch origin master
          source_head="$(git rev-parse HEAD)"
          if [ "$source_head" != "$(git rev-parse origin/master)" ]; then
            echo "Skipping superseded build: master moved while tests ran"
            exit 0
          fi
          git add -A crew-app package-lock.json
          if git diff --cached --quiet; then
            echo "Crew build already current"
          else
            git commit -m "build: update Crew SPA"
            if ! git push origin HEAD:master; then
              git fetch origin master
              if git merge-base --is-ancestor "$source_head" origin/master &&
                 [ "$source_head" != "$(git rev-parse origin/master)" ]; then
                echo "Master moved while publishing; latest master run will rebuild"
              else
                echo "::error::Publish failed without a superseding master commit"
                exit 1
              fi
            fi
          fi
      # Generated Pages output is committed on master. No duplicate CI artifact.
