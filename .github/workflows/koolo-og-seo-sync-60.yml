name: Sync Koolo generated SEO pages once (#60)
on:
  push:
    branches: [chatgpt/seo-og-koolo-60]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate deterministic SEO files
        run: |
          node scripts/generate-seo.mjs
          node scripts/generate-seo.mjs --check
          node --test tests/seo-pages.test.js
          node --check scripts/social-og.mjs
      - name: Commit generated files and remove this one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en/index.html teacher/index.html en/teacher/index.html story/index.html en/story/index.html fortune/index.html en/fortune/index.html research/index.html en/research/index.html
          git rm -- .github/workflows/koolo-og-seo-sync-60.yml
          git commit -m 'fix(seo): sync generated Koolo feature metadata (#60)'
          git push origin HEAD:chatgpt/seo-og-koolo-60
