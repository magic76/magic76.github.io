name: Verify and publish Crew Web
on:
  pull_request:
    paths:
      - 'web-spa/**'
      - 'features/**'
      - 'crew-live.js'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/crew-web.yml'
  push:
    branches: [master]
    paths:
      - 'web-spa/**'
      - 'features/**'
      - 'crew-live.js'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/crew-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:web
      - run: npm test
      - run: npm run build:web
      - name: Publish compiled static site after verified master push
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A crew-app
          if git diff --cached --quiet; then
            echo 'Compiled site already current.'
            exit 0
          fi
          git commit -m 'build(web): deploy verified Crew SPA [skip ci]'
          git push origin HEAD:master
