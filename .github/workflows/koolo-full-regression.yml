name: Koolo full regression

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"

permissions:
  contents: read

concurrency:
  group: koolo-full-regression-${{ github.ref }}
  cancel-in-progress: true

# Run the full daily safety suite in one hosted runner to avoid three
# separate checkouts, Node setups and npm ci installations.
jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Full unit regression
        run: npm test
      - name: TypeScript and translation checks
        run: |
          npm run check:web
          npm run check:i18n
      - name: Cloudflare build and contract checks
        run: |
          npm run build:cloudflare
          npm run test:cloudflare
          npm run check:bundle
