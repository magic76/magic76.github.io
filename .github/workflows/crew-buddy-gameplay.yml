name: Crew Buddy gameplay

on:
  pull_request:
    paths:
      - 'web-spa/public/crew-buddy-lab/**'
      - 'tests/crew-buddy-*.test.js'
      - '.github/workflows/crew-buddy-gameplay.yml'
  push:
    branches: [master]
    paths:
      - 'web-spa/public/crew-buddy-lab/**'
      - 'tests/crew-buddy-*.test.js'
      - '.github/workflows/crew-buddy-gameplay.yml'

# Cancel superseded PR checks without interrupting master validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out game source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Crew Buddy adventure
        run: node --test tests/crew-buddy-*.test.js
