name: Cloudflare clean-route preview build

on:
  pull_request:
    paths:
      - "web-spa/**"
      - "scripts/ssg-renderer.mjs"
      - "scripts/research-seo.mjs"
      - "scripts/research-quality.mjs"
      - "scripts/research-discovery.mjs"
      - "scripts/research-quality-report.mjs"
      - "tests/research-editorial.test.js"
      - "crew-app/briefings/**"
      - "scripts/prepare-cloudflare.mjs"
      - "vite.web.config.ts"
      - "package.json"
      - "tests/cloudflare-deployment.test.js"
      - "tests/cloudflare-browser-smoke.mjs"
      - "_headers"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/cloudflare-clean-routes.yml"
  workflow_dispatch:

jobs:
  cloudflare-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:web
      - run: npm run build:cloudflare
      - run: npm run test:cloudflare
      - run: node --test tests/research-editorial.test.js
      - run: node scripts/research-quality-report.mjs
      # Use Chrome preinstalled on Ubuntu runners; no browser code in production.
      - run: npm install --no-save --package-lock=false --no-audit --no-fund --ignore-scripts playwright@1.56.1
      - run: npm run test:browser:cloudflare
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-preview
          path: dist/
          retention-days: 2
