name: Cloudflare clean-route preview build

on:
  # No automatic Cloudflare build on PR open/synchronize; Crew SPA owns fast PR CI.
  # A repository-owner PR comment explicitly opts into this separate validation.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional open PR number to validate; 0 validates the selected branch'
        required: false
        type: number
        default: 0
      visual_qa:
        description: 'Also capture before/after screenshots and motion videos (slow, uses artifact storage)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

# Cancel older previews for the same PR; distinct manual branch runs stay independent.
concurrency:
  group: cloudflare-preview-${{ github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  cloudflare-build:
    # All other issue comments create a skipped (unbilled) job.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner &&
       (github.event.comment.body == '/crew-preview' ||
        github.event.comment.body == '/crew-preview full' ||
        github.event.comment.body == '/crew-preview visual'))
    runs-on: ubuntu-24.04
    steps:
      # issue_comment workflows run from default branch; explicitly pin the PR HEAD
      # or else they accidentally test master. Do not interpolate comment text in a shell.
      - name: Resolve requested open PR commit
        id: source
        if: github.event_name == 'issue_comment' || inputs.pr_number > 0
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha // empty' <<< "$pr_json")"
          pr_state="$(jq -r '.state // empty' <<< "$pr_json")"
          if [[ "$pr_state" != "open" || "$head_repo" != "$GITHUB_REPOSITORY" || ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Preview requires an open PR with a head in this repository"
            exit 1
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Previewing PR #$PR_NUMBER at $head_sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Crew SPA already typechecks every PR; keep standalone manual runs self-contained.
      - name: Typecheck manual run
        if: github.event_name == 'workflow_dispatch'
        run: npm run check:web
      - run: npm run build:cloudflare
      - run: npm run test:cloudflare
      - run: node --test tests/research-editorial.test.js
      - run: node scripts/research-quality-report.mjs
      # /crew-preview is the fast Cloudflare build + deployment checks only.
      # /crew-preview full and /crew-preview visual opt into expensive Chromium.
      - name: Install Playwright for manual browser smoke
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event.comment.body == '/crew-preview full' ||
          github.event.comment.body == '/crew-preview visual'
        run: npm install --no-save --package-lock=false --no-audit --no-fund --ignore-scripts playwright@1.56.1
      # Recordings need Playwright's FFmpeg, not the runner system FFmpeg.
      - name: Install FFmpeg for optional visual recordings
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.visual_qa) ||
          github.event.comment.body == '/crew-preview visual'
        run: npx playwright install ffmpeg
      - name: Full browser smoke (explicit request)
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event.comment.body == '/crew-preview full' ||
          github.event.comment.body == '/crew-preview visual'
        env:
          CREW_VISUAL_QA: ${{ ((github.event_name == 'workflow_dispatch' && inputs.visual_qa) || github.event.comment.body == '/crew-preview visual') && '1' || '0' }}
        run: npm run test:browser:cloudflare
      # Artifacts exist only for explicitly requested previews (2-day retention).
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment'
        continue-on-error: true
        with:
          name: cloudflare-pages-preview
          path: dist/
          retention-days: 2

      # Visual QA screenshots and recordings need an explicit request.
      - uses: actions/upload-artifact@v4
        if: >-
          always() &&
          ((github.event_name == 'workflow_dispatch' && inputs.visual_qa) ||
           github.event.comment.body == '/crew-preview visual')
        continue-on-error: true
        with:
          name: crew-ui-before-after
          path: artifacts/crew-visual-qa/*
          retention-days: 2
          if-no-files-found: ignore
