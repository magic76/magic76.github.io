name: Crew Tree V4 visual QA

on:
  pull_request:
    paths:
      - 'web-spa/public/crew-tree-lab/**'
      - 'tests/crew-tree-art.visual.cjs'
      - '.github/workflows/crew-tree-art-visual.yml'
  push:
    branches: [master]
    paths:
      - 'web-spa/public/crew-tree-lab/**'
      - 'tests/crew-tree-art.visual.cjs'
      - '.github/workflows/crew-tree-art-visual.yml'

permissions:
  contents: read

jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright browser for visual QA
        run: |
          npm install --prefix /tmp/crew-tree-qa playwright@1.56.1 --no-audit --no-fund --silent
          /tmp/crew-tree-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Run site and capture real-art comparisons
        run: |
          python3 -m http.server 8787 --directory web-spa/public > /tmp/crew-tree-server.log 2>&1 &
          NODE_PATH=/tmp/crew-tree-qa/node_modules node tests/crew-tree-art.visual.cjs
      - name: Store 3/8/16-turn and 24-tree screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crew-tree-v4-browser-screenshots
          path: /tmp/crew-tree-art-shots
          if-no-files-found: warn
          retention-days: 14
