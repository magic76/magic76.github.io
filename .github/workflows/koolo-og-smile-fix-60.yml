name: Correct Koolo wordmark smile placement once (#60)
on:
  push:
    branches:
      - chatgpt/seo-og-koolo-60
permissions:
  contents: write
jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build-time-only raster tools
        run: python -m pip install Pillow==11.3.0 CairoSVG==2.8.2
      - name: Re-render six social PNGs from the approved full Koolo wordmark
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import io, cairosvg
          
          SIZE=(1200,630)
          SVG=Path('web-spa/public/brand/koolo-wordmark-koo-v2.svg').read_text()
          BOLD='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          REGULAR='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          def font(size,bold=True):
              return ImageFont.truetype(BOLD if bold else REGULAR,size)
          def source(path):
              image=Image.open(path).convert('RGBA')
              assert image.size==SIZE,(path,image.size)
              return image
          def wordmark(image,x,y,width,light=False):
              # Approved vector: the detached smile lives exactly beneath the FIRST two o's.
              # The SVG's smile path is M55 44 Q66 47 77 44, centered on o's at x53/x79.
              svg=SVG.replace('#153A35','#D9F2B1') if light else SVG
              height=round(width*48/160)
              icon=Image.open(io.BytesIO(cairosvg.svg2png(bytestring=svg.encode(),output_width=width,output_height=height))).convert('RGBA')
              image.alpha_composite(icon,(x,y))
          def publish(image,target):
              target=Path(target)
              target.parent.mkdir(parents=True,exist_ok=True)
              limit=1100000 if 'koolo-shared' in str(target) else 400000
              for colors in (256,224,192,160):
                  png=image.convert('RGB').quantize(colors=colors,method=Image.Quantize.MEDIANCUT,dither=Image.Dither.NONE)
                  png.save(target,'PNG',optimize=True,compress_level=9)
                  if target.stat().st_size<limit: break
              assert target.stat().st_size<limit,target
              assert Image.open(target).size==SIZE,target
              print(f'{target}: {target.stat().st_size:,} bytes')
          
          # Preserve all five original chibi illustrations and their Chinese headings.
          for slug in ('teacher','story','games','fortune','research'):
              image=source(f'social/og/{slug}-chibi-v1.png')
              draw=ImageDraw.Draw(image)
              draw.rounded_rectangle((24,22,617,145),radius=31,fill=(251,250,255,250))
              wordmark(image,34,38,290)
              label=slug.upper()
              bbox=draw.textbbox((0,0),label,font=font(28))
              draw.rounded_rectangle((339,57,393+bbox[2],109),radius=25,fill=(110,105,207))
              draw.text((365,64),label,font=font(28),fill='white')
              publish(image,f'social/og/{slug}-koolo-v1.png')
          
          # Preserve the three-person home hero and correct only its branded areas.
          image=source('social/crew-shared-v2.png')
          overlay=Image.new('RGBA',SIZE,(13,27,56,0))
          alpha=Image.new('L',SIZE,0)
          brush=ImageDraw.Draw(alpha)
          for x in range(650):
              opacity=255 if x<=390 else round(255*(650-x)/260)
              if opacity:
                  brush.line((x,0,x,350),fill=opacity)
                  for y in range(350,451):
                      brush.point((x,y),fill=round(opacity*(450-y)/100))
          overlay.putalpha(alpha)
          image=Image.alpha_composite(image,overlay)
          draw=ImageDraw.Draw(image)
          wordmark(image,36,135,371,light=True)
          draw.text((43,266),'Your AI Friends',font=font(46),fill='white')
          draw.text((46,337),'Learn  ·  Chat  ·  Play  ·  Explore',font=font(20,False),fill=(220,228,245))
          draw.rounded_rectangle((600,454,740,490),radius=11,fill=(65,59,76,248))
          draw.text((616,461),'Koolo',font=font(23),fill=(235,227,240))
          draw.rounded_rectangle((348,471,438,502),radius=8,fill=(25,22,37,246))
          draw.text((358,476),'Koolo',font=font(17),fill=(236,231,242))
          publish(image,'social/koolo-shared-v1.png')
          PY
      - name: Replace PNGs and remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social/koolo-shared-v1.png social/og/*-koolo-v1.png
          git rm .github/workflows/koolo-og-smile-fix-60.yml
          git commit -m 'fix(seo): approved full Koolo wordmark and oo-centered smile (#60)'
          git push origin HEAD:chatgpt/seo-og-koolo-60
      - name: Verify OG static metadata and image budgets
        run: node --test tests/seo-pages.test.js
