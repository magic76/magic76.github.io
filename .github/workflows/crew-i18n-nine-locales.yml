name: Crew nine-language UI localization

on:
  push:
    branches:
      - feat/i18n-nine-locales-20261021
    paths:
      - .github/workflows/crew-i18n-nine-locales.yml
      - scripts/generate-ui-locales.mjs
      - config/ui-locales.json
      - web-spa/src/i18n/**
      - tests/ui-nine-locales.test.js

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip-i18n]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout translation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify translation access
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not configured; translated files cannot be generated"
            exit 1
          fi
      - name: Generate nine-language UI catalogs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CREW_I18N_MODEL: gemini-2.5-flash-lite
        run: node scripts/generate-ui-locales.mjs
      - name: Assert complete keys and stable interpolation placeholders
        run: |
          node scripts/generate-ui-locales.mjs --check
          node --test tests/ui-nine-locales.test.js tests/web-i18n.test.js
      - name: Build and typecheck Crew Web
        run: |
          npm ci --ignore-scripts
          npm run check:web
          npm run build:web
      - name: Commit all validated locale files back to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-spa/src/i18n/locales
          if git diff --cached --quiet; then
            echo "Translation catalogs already up to date"
            exit 0
          fi
          git commit -m "feat(i18n): generate nine complete UI locale catalogs [skip-i18n]"
          git push origin HEAD:refs/heads/feat/i18n-nine-locales-20261021
