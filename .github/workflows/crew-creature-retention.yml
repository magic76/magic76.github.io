name: Crew Creature Lab retention browser QA
on:
  pull_request:
    paths:
      - 'web-spa/public/crew-creature-lab/**'
      - 'crew-app/crew-creature-lab/**'
      - 'tests/crew-creature-lab.test.js'
      - 'tests/crew-creature-chat-rewards.test.mjs'
      - 'web-spa/src/pages/creatureChatRewards.*'
      - 'web-spa/src/live/TextChatPanel.tsx'
      - 'web-spa/src/friends/FriendLivePage.tsx'
      - 'web-spa/src/teacher/LivePage.tsx'
      - 'tests/crew-creature-retention.visual.cjs'
      - '.github/workflows/crew-creature-retention.yml'
permissions:
  contents: read
jobs:
  retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run save migration and progression regressions
        run: node --test tests/crew-creature-lab.test.js tests/crew-creature-chat-rewards.test.mjs
      - name: Install isolated Playwright for real viewport tests
        run: |
          npm install --prefix /tmp/crew-creature-qa playwright@1.56.1 --no-audit --no-fund --silent
          /tmp/crew-creature-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Compare master and PR, replay hatch/gifts/revisit in Chromium
        run: |
          git fetch --no-tags --depth=1 origin master
          git worktree add --detach /tmp/crew-creature-master origin/master
          python3 -m http.server 8787 --directory web-spa/public > /tmp/creature-qa-server.log 2>&1 &
          python3 -m http.server 8788 --directory /tmp/crew-creature-master/web-spa/public > /tmp/creature-qa-master.log 2>&1 &
          NODE_PATH=/tmp/crew-creature-qa/node_modules node tests/crew-creature-retention.visual.cjs
      - name: Upload actual 360/390/desktop before-and-after captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crew-creature-retention-browser-captures
          path: /tmp/crew-creature-retention-shots
          retention-days: 14
          if-no-files-found: warn
