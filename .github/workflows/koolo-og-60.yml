name: Render Koolo social image assets once (#60)
on:
  push:
    branches:
      - chatgpt/seo-og-koolo-60
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install one-time image renderer
        run: python -m pip install Pillow==11.3.0
      - name: Generate six brand-updated PNG files
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          
          SIZE = (1200, 630)
          MARK = Image.open('crew-app/icons/koolo-v2-512.png').convert('RGBA')
          BOLD = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          REGULAR = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          def font(n, bold=True):
              return ImageFont.truetype(BOLD if bold else REGULAR, n)
          def source(path):
              image = Image.open(path).convert('RGBA')
              assert image.size == SIZE, (path, image.size)
              return image
          def mark_on(image, x, y, size):
              icon = MARK.resize((size, size), Image.Resampling.LANCZOS)
              image.alpha_composite(icon, (x, y))
          def publish(image, target):
              target = Path(target)
              target.parent.mkdir(parents=True, exist_ok=True)
              for colors in (256, 224, 192, 160):
                  result = image.convert('RGB').quantize(
                      colors=colors, method=Image.Quantize.MEDIANCUT,
                      dither=Image.Dither.NONE
                  )
                  result.save(target, 'PNG', optimize=True, compress_level=9)
                  if target.stat().st_size < (1100000 if 'koolo-shared' in str(target) else 400000):
                      break
              assert target.stat().st_size < (1100000 if 'koolo-shared' in str(target) else 400000), target
              assert Image.open(target).size == SIZE
              print(f'{target}: {target.stat().st_size:,} B')
          
          # Preserve the original illustrations, Chinese headings, speech bubbles and
          # background. Cover only the Crew wordmark strip in the top-left corner.
          for slug in ('teacher', 'story', 'games', 'fortune', 'research'):
              image = source(f'social/og/{slug}-chibi-v1.png')
              draw = ImageDraw.Draw(image)
              draw.rounded_rectangle((24, 22, 617, 145), radius=31, fill=(251, 250, 255, 250))
              mark_on(image, 45, 37, 92)
              draw.text((152, 45), 'Koolo', font=font(64), fill=(21, 58, 53))
              tag = slug.upper()
              bbox = draw.textbbox((0, 0), tag, font=font(27))
              draw.rounded_rectangle((410, 59, 448 + bbox[2], 110), radius=24, fill=(110, 105, 207))
              draw.text((429, 66), tag, font=font(27), fill='white')
              publish(image, f'social/og/{slug}-koolo-v1.png')
          
          # The homepage retains the three-person scene. Replace old lettering on the
          # navy left side, and the tiny Crew wordmarks on laptop and mug.
          image = source('social/crew-shared-v2.png')
          overlay = Image.new('RGBA', SIZE, (13, 27, 56, 0))
          alpha = Image.new('L', SIZE, 0)
          mask = ImageDraw.Draw(alpha)
          for x in range(650):
              opacity = 255 if x <= 390 else round(255 * (650 - x) / 260)
              if opacity:
                  mask.line((x, 0, x, 350), fill=opacity)
                  for y in range(350, 451):
                      mask.point((x, y), fill=round(opacity * (450 - y) / 100))
          overlay.putalpha(alpha)
          image = Image.alpha_composite(image, overlay)
          draw = ImageDraw.Draw(image)
          mark_on(image, 42, 145, 99)
          draw.text((152, 158), 'Koolo', font=font(79), fill=(217, 242, 177))
          draw.text((43, 268), 'Your AI Friends', font=font(46), fill='white')
          draw.text((46, 336), 'Learn  ·  Chat  ·  Play  ·  Explore',
                    font=font(20, False), fill=(220, 228, 245))
          draw.rounded_rectangle((600, 454, 740, 490), radius=11, fill=(65, 59, 76, 248))
          draw.text((616, 461), 'Koolo', font=font(23), fill=(235, 227, 240))
          draw.rounded_rectangle((348, 471, 438, 502), radius=8, fill=(25, 22, 37, 246))
          draw.text((358, 476), 'Koolo', font=font(17), fill=(236, 231, 242))
          publish(image, 'social/koolo-shared-v1.png')
          PY
      - name: Commit image assets and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social/koolo-shared-v1.png social/og/*-koolo-v1.png
          git rm -- .github/workflows/koolo-og-60.yml
          git commit -m 'assets(seo): ship six optimized Koolo OG previews (#60)'
          git push origin HEAD:chatgpt/seo-og-koolo-60
      - name: Validate published SEO metadata
        run: |
          node scripts/generate-seo.mjs --check
          node --test tests/seo-pages.test.js
