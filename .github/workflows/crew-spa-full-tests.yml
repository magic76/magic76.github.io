name: Crew SPA full tests

on:
  # Full regression tests run once per day on the default branch.
  schedule:
    - cron: "37 19 * * *"
  # To test a PR manually, select its source branch in the Actions UI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crew-spa-full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Full regression tests
        run: npm test
