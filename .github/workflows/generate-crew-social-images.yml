name: Build Crew social OG images

on:
  push:
    branches:
      - feat/seo-social-image-refresh-20261014
    paths:
      - scripts/generate-social-images.py
      - .github/workflows/generate-crew-social-images.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image generator dependencies and Chinese fonts
        run: |
          python -m pip install 'Pillow==12.3.0' 'numpy==2.3.5'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - name: Rebuild and validate five images
        run: |
          python scripts/generate-social-images.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for slug in ("crew", "teacher", "story", "fortune", "research"):
              file = Path("social") / (slug + ".png")
              with Image.open(file) as img:
                  assert img.format == "PNG" and img.size == (1200, 630), file
              print(f"{file}: validated")
          PY
      - name: Commit generated images back to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social/crew.png social/teacher.png social/story.png social/fortune.png social/research.png
          if git diff --cached --quiet; then
            echo 'No image changes generated'
          else
            git commit -m 'assets(seo): update social preview images'
            git pull --rebase origin feat/seo-social-image-refresh-20261014
            git push origin HEAD:feat/seo-social-image-refresh-20261014
          fi
