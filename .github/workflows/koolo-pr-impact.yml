name: Koolo PR impact validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: koolo-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify impact selection
        run: node --test tests/select-pr-tests.test.mjs
      - name: Run fail-closed changed-area regression
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/select-pr-tests.mjs "$BASE_SHA" "$HEAD_SHA" > /tmp/koolo-impact.json
          cat /tmp/koolo-impact.json
          node --input-type=module -e '
            import fs from "node:fs";
            import {spawnSync} from "node:child_process";
            const selection=JSON.parse(fs.readFileSync("/tmp/koolo-impact.json","utf8"));
            const args=selection.mode==="full" ? ["run","test"] : ["exec","--","node","--test",...selection.tests];
            const result=spawnSync("npm",args,{stdio:"inherit"});
            process.exit(result.status ?? 1);
          '
