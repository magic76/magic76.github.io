<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f4">
<title>Crew Story · 阿奇</title>
<link rel="stylesheet" href="features/shared/design-system.css?v={{ site.github.build_revision }}"><link rel="stylesheet" href="features/story/styles.css?v={{ site.github.build_revision }}">
</head><body class="story-theme session-page">
<header class="app-header"><div class="shell inner"><div class="app-brand"><a class="back-btn" href="story.html" aria-label="回 Crew Story">‹</a><div class="app-title"><strong>阿奇</strong><small>Crew Story</small></div></div><a class="status" data-gemini-status href="settings.html"><i class="status-dot"></i><span data-gemini-status-text>設定 Gemini</span></a></div></header>
<main class="session-shell">
<section class="session-person"><div class="avatar">A</div><h1>阿奇</h1><p>你可以邊聽邊改變故事。</p></section>
<section class="live-stage" id="liveStage" data-state="idle">
<div class="live-top"><span id="liveBadge">READY</span><span id="liveModel">Live storyteller</span></div>
<h2 class="live-title">互動說故事</h2><p class="live-sub">阿奇先講一小段，再把空間留給你。任何時候開口都可以改變故事。</p>
<label class="label">今天想聽什麼？</label><input class="field" id="topic" value="一隻怕水的小恐龍，在會發光的海邊找到一把會唱歌的雨傘">
<div class="live-orb"><span>A</span></div><div class="live-status" id="liveStatus">按開始，阿奇會立刻開場。</div>
<div class="live-controls"><button class="live-btn" id="startLive">開始故事</button><button class="live-btn end" id="stopLive" hidden>結束</button></div>
<div class="live-callbar"><div class="live-timer" id="liveTimer">0:00</div><div class="live-call-actions"><button class="live-tool-btn" id="muteLive" hidden>麥克風靜音</button><button class="live-tool-btn" id="interruptLive" hidden>打斷阿奇</button></div><label class="live-volume">音量 <input id="liveVolume" type="range" min="0" max="100" value="100"><span id="liveVolumeValue">100%</span></label></div>
<div class="live-presets"><button data-live-prompt="請自然繼續故事，下一段加入一個意外的小轉折。">繼續</button><button data-live-prompt="從現在開始讓故事更搞笑，但保留目前角色與世界觀。">變搞笑</button><button data-live-prompt="先停一下，給我兩個簡短選項，讓我決定下一步。">讓我選</button><button data-live-prompt="加入一個新角色，但不要破壞目前主線。">新角色</button></div>
<details class="live-settings" id="storySettings"><summary>故事設定</summary><div class="live-setup-grid">
<div><label class="label">風格</label><select class="field" id="style"><option>溫暖冒險</option><option>搞笑</option><option>睡前故事</option><option>神秘</option><option>奇幻</option></select></div>
<div><label class="label">敘事節奏</label><select class="field" id="pace"><option value="short">短段落</option><option value="normal" selected>自然段落</option><option value="long">長一點</option></select></div>
<div><label class="label">互動頻率</label><select class="field" id="interaction"><option value="high">常讓我選</option><option value="medium" selected>偶爾讓我選</option><option value="low">以聽故事為主</option></select></div>
<div><label class="label">阿奇音色</label><select class="field" id="voice"><option value="Aoede">Aoede</option><option value="Kore">Kore</option><option value="Puck">Puck</option><option value="Charon">Charon</option><option value="Fenrir">Fenrir</option></select></div>
<div style="display:flex;align-items:end"><button class="continue-last" id="continueLast" hidden>繼續上次故事</button></div></div><div class="pref-note">上次故事會保存在這台裝置。</div></details>
<div class="vision-box"><div class="vision-head"><strong>把一張圖放進故事</strong><span>故事書 · 插圖 · 手繪 · 照片</span></div><div class="vision-actions"><button class="vision-btn" id="takeStoryPhoto">拍照</button><button class="vision-btn" id="pickStoryPhoto">從相簿選</button></div><input id="storyCameraInput" type="file" accept="image/*" capture="environment" hidden><input id="storyGalleryInput" type="file" accept="image/*" hidden><div class="vision-preview" id="storyVisionPreview"><img id="storyVisionImage" alt=""><div><b id="storyVisionTitle">圖片已準備</b><small id="storyVisionStatus">開始後會自動成為故事素材。</small></div></div></div>
<div class="live-transcript"><div class="live-line user" id="userLine"><small>你插話</small><span></span></div><div class="live-line" id="aiLine"><small>阿奇</small><span></span></div></div>
<details class="live-history"><summary><span>完整故事對話</span><span>逐輪保留</span></summary><div class="live-history-actions"><button class="live-tool-btn" id="copyTranscript">複製全部</button></div><div class="live-history-list" id="liveTranscriptList"></div></details>
</section>
<section class="session-result" id="storyResultCard" hidden><div class="session-result-top"><h3>故事講到哪裡了</h3><span class="result-status" id="storyResultStatus"></span></div><div class="session-result-body" id="storyResultBody"></div><div class="actions"><button class="btn secondary small" id="copyStoryResult">複製故事進度</button></div></section>
<details class="secondary-zone"><summary>文字故事工具</summary><div class="panel" style="margin-top:10px"><div class="actions"><button class="btn secondary" id="textStory">產生一篇短故事</button></div><div class="result empty" id="textResult">需要完整文字時再使用。</div></div></details>
</main><div class="toast" id="toast"></div>
<script src="crew.js?v={{ site.github.build_revision }}"></script><script src="crew-live.js?v={{ site.github.build_revision }}"></script><script src="crew-live-ui.js?v={{ site.github.build_revision }}"></script><script src="features/story/live/page.js?v={{ site.github.build_revision }}"></script>
</body></html>
