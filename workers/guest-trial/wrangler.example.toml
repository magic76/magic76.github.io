# Phase 1 PRIVATE QA only. Copy to wrangler.toml; fill secrets with
# "wrangler secret put", NEVER here. No D1 database required in Phase 1.
name = "crew-guest-trial"
main = "./worker.mjs"
compatibility_date = "2026-10-28"
workers_dev = true
keep_vars = true

[vars]
GUEST_TRIAL_ENABLED = "0"
# Set GUEST_QA_ENABLED=1 in dashboard ONLY for a protected, 2–4h QA window; unset otherwise.
GUEST_TURNSTILE_SITE_KEY = "0x4AAAAAAFpJ8ljaQjJq_Aqy"
# For a Cloudflare-Access-protected Preview (exact host, not an open wildcard):
# GUEST_ALLOW_PREVIEW = "1"
# GUEST_PREVIEW_ORIGIN = "https://<actual-preview>.magic76-github-io.pages.dev"
# GUEST_QA_UNTIL = "<UTC ISO8601 timestamp within 2–4 hours>" # must include timezone

# QA backend must fail closed without this limiter. Counter is per edge
# location, approximate, NOT a global finance cap.
[[ratelimits]]
name = "GUEST_QA_RATE_LIMITER"
namespace_id = "100347"
  [ratelimits.simple]
  limit = 1
  period = 60

# Phase 2 ONLY: create a D1 database and append:
# [[d1_databases]]
# binding = "GUEST_DB"
# database_name = "crew-guest-trials"
# database_id = "<YOUR_D1_ID>"
# GUEST_DAILY_SESSION_LIMIT and GUEST_HASH_SALT are also Phase 2 only.
