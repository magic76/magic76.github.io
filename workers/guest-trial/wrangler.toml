# Phase 1 public 180-second trial, Turnstile + per-colo limit; no D1.
# "wrangler secret put", NEVER here. No D1 database required in Phase 1.
name = "crew-guest-trial"
main = "./worker.mjs"
compatibility_date = "2026-10-28"
workers_dev = true
keep_vars = true

[vars]
GUEST_TRIAL_ENABLED = "1"
GUEST_TURNSTILE_SITE_KEY = "0x4AAAAAAFpJ8ljaQjJq_Aqy"

# location, approximate, NOT a global finance cap.
[[ratelimits]]
name = "GUEST_TRIAL_RATE_LIMITER"
namespace_id = "100347"
  [ratelimits.simple]
  limit = 1
  period = 60

# Phase 2 ONLY: create a D1 database and append:
# [[d1_databases]]
# binding = "GUEST_DB"
# database_name = "crew-guest-trials"
# database_id = "<YOUR_D1_ID>"
# GUEST_DAILY_SESSION_LIMIT and GUEST_HASH_SALT are also Phase 2 only.

# Phase 3 optional signed-in account metering (leave both flags absent/off by default):
#   GUEST_ACCOUNT_METER_ENABLED = "1"  # count signed-in users, allow anonymous
#   GUEST_REQUIRE_SIGNIN = "1"         # separately require login for everyone
# Prerequisites before enabling either flag:
# - Apply migrations/crew-auth/0002_guest_trials.sql to existing crew-auth D1.
# - Set identical encrypted CREW_GUEST_TICKET_SECRET on Pages + this Worker.
# - Bind existing crew-auth D1 as CREW_AUTH_DB on this Worker.
# - Deploy Pages first, then deploy Worker. Do NOT use GUEST_DB for CREW_AUTH_DB.
