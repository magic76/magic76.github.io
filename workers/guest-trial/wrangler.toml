# Phase 1 anonymous 300-second trial + Phase 3 optional member quota.
# Configure secrets separately in Cloudflare, NEVER here.
name = "crew-guest-trial"
main = "./worker.mjs"
compatibility_date = "2026-10-28"
workers_dev = true
keep_vars = true

# Dedicated production endpoint; keep workers.dev online for a safe gradual migration.
[[routes]]
pattern = "p.koolo.app"
custom_domain = true

[vars]
GUEST_TRIAL_ENABLED = "1"
# Crew Video TTS: max new jobs per UTC day (valid 1–50; invalid/missing -> 20).
CREW_VIDEO_TTS_MAX_JOBS_PER_DAY = "20"
GUEST_TURNSTILE_SITE_KEY = "0x4AAAAAAFpJ8ljaQjJq_Aqy"

# location, approximate, NOT a global finance cap.
[[ratelimits]]
name = "GUEST_TRIAL_RATE_LIMITER"
namespace_id = "100347"
  [ratelimits.simple]
  limit = 1
  period = 60

# Phase 3: existing OAuth member D1; distinct from optional anonymous GUEST_DB.
[[d1_databases]]
binding = "CREW_AUTH_DB"
database_name = "crew-auth"
database_id = "2ccb5252-84b9-447a-9e98-4906a7319613"

# Phase 2 ONLY: create a D1 database and append:
# [[d1_databases]]
# binding = "GUEST_DB"
# database_name = "crew-guest-trials"
# database_id = "<YOUR_D1_ID>"
# GUEST_DAILY_SESSION_LIMIT and GUEST_HASH_SALT are also Phase 2 only.

# Phase 3 optional signed-in account metering (leave both flags absent/off by default):
#   GUEST_ACCOUNT_METER_ENABLED = "1"  # count signed-in users, allow anonymous
#   GUEST_REQUIRE_SIGNIN = "1"         # separately require login for everyone
# Prerequisites before enabling either flag:
# - Apply migrations/crew-auth/0002_guest_trials.sql to existing crew-auth D1.
# - Set identical encrypted CREW_GUEST_TICKET_SECRET on Pages + this Worker.
# - Existing crew-auth D1 binding is configured above. Confirm the ID in Cloudflare.
# - Deploy Pages first, then deploy Worker. Do NOT use GUEST_DB for CREW_AUTH_DB.

# Crew Video TTS: one authorized GitHub-main request every five minutes.
# A protected GitHub-main queue entry with enabled:true authorizes TTS; emergency off: CREW_VIDEO_TTS_ENABLED=0.
# This uses existing GEMINI_GUEST_API_KEYS and CREW_AUTH_DB. No GitHub Actions.
[triggers]
crons = ["*/5 * * * *"]
